# Override — ajoute le tier "Backend" du scan : vision LOCALE auto-hébergée (Ollama),
# distincte du provider Gemini. Fusionné automatiquement par `docker compose` PAR-DESSUS
# le docker-compose.yml (patché serveur : whisper, edge, container_names) sans l'altérer.
services:
  # Tier-0 food4k — classifieur d'aliments ONNX (Food-101, 91% top-1), CPU int8.
  # Rapide + gratuit, placé AVANT la cascade VLM : si confiance >= seuil, réponse
  # directe (nom + nutrition per-100g) sans appel Cloudflare/Ollama/Groq/Gemini.
  food4k:
    build: ./food4k
    container_name: salorie-food4k
    restart: unless-stopped
    expose: ["8000"]
    networks: [default]

  backend:
    # Specificites de srv3, volontairement ICI et pas dans docker-compose.yml : ce dernier
    # est ecrase a chaque deploiement par la version du depot, qui ignore la topologie
    # reelle de ce serveur. Le 3 aout 2026, un deploiement l'a remplace et a coupe l'API
    # (502) pendant plusieurs minutes, pour ces deux raisons exactement.
    #
    # container_name : Caddy relaie vers `salorie-backend:4000`. Sans nom fixe, Compose
    # nomme le conteneur `salorie-stack-backend-1` et Caddy ne le trouve plus.
    # networks : Caddy vit sur le reseau `edge`. Un backend seulement sur le reseau par
    # defaut de la stack est injoignable depuis le proxy.
    container_name: salorie-backend
    networks: [default, edge]
    depends_on: [mongo, redis, food4k]
    environment:
      # Tier Backend = Cloudflare Workers AI (edge GPU). Ollama, l ancien repli, est retire.
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      # llava-1.5-7b retire le 13 aout 2026 : teste depuis le conteneur de production,
      # il renvoie HTTP 400 la ou @cf/meta/llama-3.2-11b-vision-instruct renvoie 200 et
      # identifie correctement un tagine (« It is a red tagine. »). Cet override ecrasait
      # le defaut de ml.service.ts, que le code decrit lui-meme comme « bien meilleur sur
      # les plats MENA ». On laisse desormais le code choisir ; la variable reste
      # surchargeable par l'environnement si besoin.
      CF_VISION_MODEL: ${CF_VISION_MODEL:-}
      # OLLAMA_URL retiree : le service ollama est supprime (cf. docker-compose.yml).
      # `tryOllama` se saute proprement quand la variable est absente.
      FOOD_VISION_API_URL: ${FOOD_VISION_API_URL:-}
      FOOD_VISION_API_KEY: ${FOOD_VISION_API_KEY:-}
      # Tier-0 ONNX : URL du sidecar + seuil de confiance (>= -> réponse directe).
      FOOD4K_URL: ${FOOD4K_URL:-http://food4k:8000}
      FOOD4K_MIN_CONF: ${FOOD4K_MIN_CONF:-0.60}
      # Relais TURN (S2). Le secret est PARTAGE avec coturn : le backend signe des
      # identifiants ephemeres que coturn revalide par le meme HMAC, sans tenir
      # aucune base de comptes. Vide = seul le STUN est propose, et l'API le DIT.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-turn.salorie.com}

  web:
    # Meme raison que pour backend : Caddy relaie vers `salorie-web:3000` sur le reseau
    # `edge`. Sans ces deux lignes, Compose nomme le conteneur `salorie-stack-web-1`,
    # l'admin devient injoignable — constate le 3 aout 2026.
    container_name: salorie-web
    networks: [default, edge]

  # ── coturn : relais TURN/STUN pour la voix de la marche a deux (15 aout 2026) ──
  # Pourquoi un relais et pas seulement du STUN : beaucoup d'abonnes mobiles
  # marocains sont derriere un NAT d'operateur (CGNAT). STUN ne suffit alors pas a
  # etablir la liaison directe, et sans TURN l'appel echoue purement et simplement.
  #
  # `network_mode: host` est une contrainte de coturn, pas un confort : il doit voir
  # la vraie adresse publique et ouvrir une PLAGE de ports UDP pour les relais. En
  # reseau bridge, Docker reecrit les adresses et les candidats ICE annonces sont
  # inutilisables.
  #
  # La plage de relais est volontairement COURTE (49160-49200, soit 40 sessions
  # simultanees). Publier les 16 000 ports par defaut sur une machine partagee est
  # une surface d'attaque inutile a cette echelle ; la plage s'elargira quand le
  # trafic l'exigera.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: salorie-coturn
    restart: unless-stopped
    # PORTS PUBLIES plutot que `network_mode: host` (15 aout 2026).
    #
    # Le mode host etait le choix « propre » sur le papier : coturn voit la vraie
    # adresse publique et ouvre sa plage de relais sans intermediaire. Il avait un
    # defaut fatal ici — Docker ne pose AUCUNE regle reseau pour un conteneur en
    # mode host. Le port 3478 restait donc derriere le pare-feu de la machine, et
    # l'ouvrir demandait un sudo dont personne n'a le mot de passe.
    #
    # En publiant les ports, Docker insere lui-meme ses regles, qui passent AVANT
    # celles d'ufw. Le relais devient joignable sans toucher au pare-feu.
    #
    # Contrepartie : coturn est desormais derriere une traduction d'adresse et ne
    # connait plus l'adresse publique. Sans `--external-ip`, il annoncerait son IP
    # de conteneur (172.x) dans ses candidats ICE — inutilisable depuis Internet.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Plage de relais VOLONTAIREMENT COURTE : Docker cree une regle par port, et
      # publier les 16 000 ports par defaut rendrait le demarrage interminable.
      # 21 ports = 21 sessions relayees simultanees, tres au-dela du trafic actuel.
      - "49160-49180:49160-49180/udp"
    command: >-
      -n
      --listening-ip=0.0.0.0
      --listening-port=3478
      --external-ip=${TURN_PUBLIC_IP:-}
      --realm=${TURN_HOST:-turn.salorie.com}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-changez-moi}
      --min-port=49160
      --max-port=49180
      --no-tls
      --no-dtls
      --no-cli
      --log-file=stdout
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Reseau partage avec le proxy Caddy, cree hors de cette stack.
  edge:
    external: true

