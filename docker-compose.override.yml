# Override — ajoute le tier "Backend" du scan : vision LOCALE auto-hébergée (Ollama),
# distincte du provider Gemini. Fusionné automatiquement par `docker compose` PAR-DESSUS
# le docker-compose.yml (patché serveur : whisper, edge, container_names) sans l'altérer.
services:
  # Tier-0 food4k — classifieur d'aliments ONNX (Food-101, 91% top-1), CPU int8.
  # Rapide + gratuit, placé AVANT la cascade VLM : si confiance >= seuil, réponse
  # directe (nom + nutrition per-100g) sans appel Cloudflare/Ollama/Groq/Gemini.
  food4k:
    build: ./food4k
    container_name: salorie-food4k
    restart: unless-stopped
    expose: ["8000"]
    networks: [default]

  backend:
    # Specificites de srv3, volontairement ICI et pas dans docker-compose.yml : ce dernier
    # est ecrase a chaque deploiement par la version du depot, qui ignore la topologie
    # reelle de ce serveur. Le 3 aout 2026, un deploiement l'a remplace et a coupe l'API
    # (502) pendant plusieurs minutes, pour ces deux raisons exactement.
    #
    # container_name : Caddy relaie vers `salorie-backend:4000`. Sans nom fixe, Compose
    # nomme le conteneur `salorie-stack-backend-1` et Caddy ne le trouve plus.
    # networks : Caddy vit sur le reseau `edge`. Un backend seulement sur le reseau par
    # defaut de la stack est injoignable depuis le proxy.
    container_name: salorie-backend
    networks: [default, edge]
    depends_on: [mongo, redis, food4k]
    environment:
      # Tier Backend = Cloudflare Workers AI (edge GPU). Ollama, l ancien repli, est retire.
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      # llava-1.5-7b retire le 13 aout 2026 : teste depuis le conteneur de production,
      # il renvoie HTTP 400 la ou @cf/meta/llama-3.2-11b-vision-instruct renvoie 200 et
      # identifie correctement un tagine (« It is a red tagine. »). Cet override ecrasait
      # le defaut de ml.service.ts, que le code decrit lui-meme comme « bien meilleur sur
      # les plats MENA ». On laisse desormais le code choisir ; la variable reste
      # surchargeable par l'environnement si besoin.
      CF_VISION_MODEL: ${CF_VISION_MODEL:-}
      # OLLAMA_URL retablie le 31/08/2026 avec le service (cf. docker-compose.yml).
      # `tryOllama` se saute proprement quand la variable est absente, ce qui
      # laisse la pile fonctionner meme si le conteneur est arrete.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      FOOD_VISION_API_URL: ${FOOD_VISION_API_URL:-}
      FOOD_VISION_API_KEY: ${FOOD_VISION_API_KEY:-}
      # Tier-0 : URL du sidecar + seuils de confiance (>= -> réponse directe).
      #
      # ⚠⚠ CE FICHIER GAGNE SUR ml.service.ts — MAIS LE .env DU VPS GAGNE SUR LUI.
      # Le `${VAR:-defaut}` n'applique le defaut que si la variable est ABSENTE de
      # l'environnement. Or le .env du serveur est preserve d'un deploiement a
      # l'autre (deploy-backend-web.yml le dit expressement), et il porte une
      # valeur posee a la main. Sonde du 31/08/2026 : une reponse du tier-0 est
      # passee a 0,53 — sous les 0,60 d'ici comme sous les 0,90 du code.
      # Modifier ce fichier ne suffit donc PAS : il faut aussi editer le .env sur
      # le VPS, ou l'y retirer pour que cette valeur reprenne la main.
      # `node scripts/seuil-effectif.js` dit ce qui s'applique vraiment.
      # Le seuil a ete porte a 0,80 puis 0,90 DANS LE CODE les 30 et 31/08/2026,
      # et ces deux changements n'ont RIEN produit en production : la valeur
      # partait d'ici, figee a 0,60. Deux mesures ont ete attribuees a un reglage
      # qui n'avait jamais pris. Quand une valeur vit a deux endroits, c'est
      # toujours celle qu'on n'a pas modifiee qui decide.
      #
      # Mesure du 31/08 sur 98 photos de cuisine marocaine, seuil effectif 0,60 :
      #   tier0    28 servies    7,1 % justes
      #   openai   59 servies   35,6 %
      # Cinq fois moins bon que le palier suivant : chacune de ces reponses est
      # une fiche nutritionnelle fausse ecrite dans un journal.
      #
      # Sur Food-101, monter a 0,90 fait passer la justesse de ce qui est servi
      # de 82,6 % a 93,5 %, pour une couverture qui tombe de 45 % a 31 %. Le
      # reste descend vers le cloud : plus lent, payant, et plus juste.
      # ⚠ QUATRE PALIERS PAYANTS ETAIENT MUETS — CONSTATE LE 01/09/2026.
      # Leurs cles etaient valides ; les MODELES demandes n'existaient plus. Les
      # fournisseurs le disaient en toutes lettres, et personne ne le lisait :
      #   zhipu     glm-4v-flash                    « 模型不存在 » (modele inexistant)
      #   moonshot  moonshot-v1-128k-vision-preview  HTTP 404 Not found
      #   xai       grok-2-vision-1212               « Model not found »
      #   anthropic claude-3-5-sonnet-latest         absent de la liste
      #
      # Les noms ci-dessous sont pris dans la liste que CHAQUE fournisseur publie
      # aujourd'hui (cf. GET /ml/vision-tiers). Les verifier apres tout changement
      # avec `?essai=1`, qui envoie une vraie image : exister ne prouve pas savoir
      # voir, et c'est la deuxieme couche du meme piege.
      ZHIPU_VISION_MODEL: ${ZHIPU_VISION_MODEL:-glm-5.3-flash}
      MOONSHOT_VISION_MODEL: ${MOONSHOT_VISION_MODEL:-kimi-k3}
      XAI_VISION_MODEL: ${XAI_VISION_MODEL:-grok-4.6}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL:-claude-haiku-4-5-20251001}
      FOOD4K_URL: ${FOOD4K_URL:-http://food4k:8000}
      FOOD4K_MIN_CONF: ${FOOD4K_MIN_CONF:-0.80}
      # Seuil PLUS STRICT pour les classes locales (marocaines / MENA), ou le
      # modele est nettement plus faible : a 0,80 il annonce juste 48,5 % du
      # temps contre 81,4 % sur les classes Food-101 (n=1 549, 30/08).
      # Ecrit ici EXPRESSEMENT, meme s'il vaut deja cela dans le code : laisser
      # un seul des deux seuils dans l'override etait precisement le piege.
      FOOD4K_MIN_CONF_LOCALE: ${FOOD4K_MIN_CONF_LOCALE:-0.95}
      # Relais TURN (S2). Le secret est PARTAGE avec coturn : le backend signe des
      # identifiants ephemeres que coturn revalide par le meme HMAC, sans tenir
      # aucune base de comptes. Vide = seul le STUN est propose, et l'API le DIT.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-turn.salorie.com}
      # Port du TURN sur TLS. Vide = l'adresse `turns:` n'est pas annoncee : une
      # adresse que personne n'ecoute ferait patienter chaque client sur un
      # serveur mort avant qu'il essaie les autres. Doit rester d'accord avec le
      # `--tls-listening-port` de coturn plus bas.
      TURN_TLS_PORT: ${TURN_TLS_PORT:-}

  web:
    # Meme raison que pour backend : Caddy relaie vers `salorie-web:3000` sur le reseau
    # `edge`. Sans ces deux lignes, Compose nomme le conteneur `salorie-stack-web-1`,
    # l'admin devient injoignable — constate le 3 aout 2026.
    container_name: salorie-web
    networks: [default, edge]

  # ── coturn : relais TURN/STUN pour la voix de la marche a deux (15 aout 2026) ──
  # Pourquoi un relais et pas seulement du STUN : beaucoup d'abonnes mobiles
  # marocains sont derriere un NAT d'operateur (CGNAT). STUN ne suffit alors pas a
  # etablir la liaison directe, et sans TURN l'appel echoue purement et simplement.
  #
  # `network_mode: host` est une contrainte de coturn, pas un confort : il doit voir
  # la vraie adresse publique et ouvrir une PLAGE de ports UDP pour les relais. En
  # reseau bridge, Docker reecrit les adresses et les candidats ICE annonces sont
  # inutilisables.
  #
  # La plage de relais est volontairement COURTE (49160-49200, soit 40 sessions
  # simultanees). Publier les 16 000 ports par defaut sur une machine partagee est
  # une surface d'attaque inutile a cette echelle ; la plage s'elargira quand le
  # trafic l'exigera.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: salorie-coturn
    restart: unless-stopped
    # `edge` en plus du reseau par defaut : c'est celui de Caddy. Sans lui, Caddy
    # ne resout meme pas le nom `salorie-coturn` — necessaire pour router vers le
    # relais depuis le port 443 selon le SNI (les reseaux d'entreprise qui ne
    # laissent sortir que le 443 sont les seuls que le 5349 ne couvre pas).
    # Passer par l'IP de la passerelle de l'hote marcherait aussi, mais elle
    # change au gre des recreations de reseau — un nom, non.
    networks: [default, edge]
    # PORTS PUBLIES plutot que `network_mode: host` (15 aout 2026).
    #
    # Le mode host etait le choix « propre » sur le papier : coturn voit la vraie
    # adresse publique et ouvre sa plage de relais sans intermediaire. Il avait un
    # defaut fatal ici — Docker ne pose AUCUNE regle reseau pour un conteneur en
    # mode host. Le port 3478 restait donc derriere le pare-feu de la machine, et
    # l'ouvrir demandait un sudo dont personne n'a le mot de passe.
    #
    # En publiant les ports, Docker insere lui-meme ses regles, qui passent AVANT
    # celles d'ufw. Le relais devient joignable sans toucher au pare-feu.
    #
    # Contrepartie : coturn est desormais derriere une traduction d'adresse et ne
    # connait plus l'adresse publique. Sans `--external-ip`, il annoncerait son IP
    # de conteneur (172.x) dans ses candidats ICE — inutilisable depuis Internet.
    #
    # DURCISSEMENT (retabli le 15 aout 2026, apres confirmation que le service
    # demarre). Un relais TURN acheminE du trafic vers l'adresse que le CLIENT
    # demande : sans restriction, un compte legitime peut s'en servir pour atteindre
    # le reseau prive du serveur — les conteneurs Mongo et Redis sont sur 172.x, a
    # un saut de la. Les plages privees, le loopback et le lien-local sont donc
    # refuses comme destinations, le relais TCP est coupe, et des quotas bornent ce
    # qu'un seul compte peut consommer.
    #
    # `--no-multicast-peers` et `--no-loopback-peers` ont ete RETIRES de cette liste :
    # coturn 4.6 les rejette (il repond par son aide et sort en 255), ces protections
    # etant devenues son comportement par defaut. Les y remettre recasserait le
    # service — c'est ce qui vient d'arriver le 15 aout 2026.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Plage de relais VOLONTAIREMENT COURTE : Docker cree une regle par port, et
      # publier les 16 000 ports par defaut rendrait le demarrage interminable.
      # 21 ports = 21 sessions relayees simultanees, tres au-dela du trafic actuel.
      - "49160-49180:49160-49180/udp"
      # 5349 : le port standard du TURN sur TLS. Il ne REMPLACE pas le 3478 — un
      # client parcourt la liste ICE dans l'ordre et retombe dessus si le TLS est
      # filtre. Reserve : un reseau qui n'autorise QUE le 443 restera bloque, le
      # 443 appartenant a Caddy et cette machine n'ayant qu'une adresse IP.
      - "5349:5349/tcp"
      - "5349:5349/udp"
    volumes:
      # Une COPIE des certificats, pas le magasin de Caddy lui-meme. Monter ce
      # dernier ne marche pas : l'image coturn tourne en `nobody` (uid 65534) et
      # Caddy garde son magasin en `drwx------ root` — coturn repondait « cannot
      # find certificate file », qui etait en verite un refus de permission
      # (21/08/2026). Le deploiement copie les deux fichiers ici via `docker cp`
      # (le demon docker, lui, est root) puis les donne a `nobody`. La cle reste
      # en 600 : lisible par coturn, par personne d'autre.
      - ./certs-turn:/certs:ro
    # (Cette ligne existe pour que `docker compose up -d` recree coturn : il ne
    # recree un service que si sa configuration a change, et il fallait le forcer
    # une fois pour qu'il relise enfin ses certificats — 21/08/2026.)
    #
    # ⚠ AUCUN COMMENTAIRE DANS LE BLOC `command:` CI-DESSOUS. C'est un scalaire
    # replie (`>-`) : un `#` n'y est pas un commentaire, il devient du TEXTE et
    # docker refuse tout le service — « invalid command line string », 21/08/2026.
    #
    # TLS (5349) : ce n'est PAS de la confidentialite en plus, le media est deja
    # chiffre de bout en bout par DTLS-SRTP et le relais ignore ce qu'il
    # transporte. C'est une question d'ACCESSIBILITE — beaucoup de reseaux
    # d'entreprise et d'hotels laissent passer le TLS et bloquent le reste ;
    # sans lui l'appel n'echoue pas a moitie, il n'a pas lieu. Le certificat est
    # celui que Caddy obtient et RENOUVELLE pour turn.salorie.com (bloc ajoute a
    # son Caddyfile le 20/08 dans ce seul but) : aucun certbot a maintenir.
    command: >-
      -n
      --listening-ip=0.0.0.0
      --listening-port=3478
      --external-ip=${TURN_PUBLIC_IP:-}
      --realm=${TURN_HOST:-turn.salorie.com}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-changez-moi}
      --min-port=49160
      --max-port=49180
      --tls-listening-port=5349
      --cert=/certs/turn.crt
      --pkey=/certs/turn.key
      --no-cli
      --log-file=stdout
      --fingerprint
      --no-tcp-relay
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --user-quota=12
      --total-quota=200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Reseau partage avec le proxy Caddy, cree hors de cette stack.
  edge:
    external: true

