# Salorie full stack: MongoDB + Redis + NestJS API + Next.js admin (+ sidecar food4k via override).
# Usage:  FIREBASE_SERVICE_ACCOUNT='<json>' docker compose up -d --build
services:
  # Datastores are NOT published to the host — only the backend reaches them over
  # the internal docker network (mongo:27017, redis:6379, minio:9000). Keeps them
  # off the public internet.
  mongo:
    image: mongo:7
    restart: unless-stopped
    # `MONGO_CMD` vaut `mongod --auth` en production, pose par le deploiement
    # UNE FOIS le compte cree. La valeur par defaut demarre SANS
    # authentification, et c'est deliberé : activer la serrure avant d'avoir
    # fabrique la clef rendrait la base inaccessible a tout le monde, y compris
    # au deploiement qui doit justement y creer le compte.
    command: ${MONGO_CMD:-mongod}
    volumes: [salorie_mongo:/data/db]
    expose: ["27017"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose: ["6379"]

  # MinIO retire le 13 aout 2026. Il tournait depuis l'origine sans jamais servir :
  # AUCUNE reference a minio, a un bucket ou a un client S3 dans backend/src. Le stockage
  # de fichiers passe par le disque local (`UPLOAD_DIR`, cf. files.controller.ts:10-24),
  # et son commentaire ligne 16 le dit deja : « swap for MinIO/S3 in prod ». Ce basculement
  # n'a jamais eu lieu. Son volume ne contenait que ses propres metadonnees (136 Ko).
  # Cout du maintien : 241 Mo d'image + 144 Mo de RAM + une surface d'attaque.
  # Pour le remettre : restaurer ce service ET brancher files.controller.ts dessus.

  # Ollama retire le 13 aout 2026. Il servait de repli de vision auto-heberge (moondream,
  # CPU) et n'a recu AUCUNE requete d'inference en huit semaines — verifie sur la totalite
  # de ses journaux. Il n'etait pourtant pas du poids mort : Cloudflare, Groq et Gemini
  # etant tous inoperants, il etait le SEUL repli reel derriere food4k. C'est pourquoi il
  # a ete conserve tant que Cloudflare n'etait pas actif.
  # Cloudflare Workers AI l'est desormais, verifie depuis le conteneur de production :
  # @cf/meta/llama-3.2-11b-vision-instruct repond HTTP 200 et identifie un tagine.
  # Il le precede dans la cascade, sur GPU au lieu du CPU. Ollama liberait 8,27 Go
  # d'image + 1,7 Go de modele.
  # REMIS LE 31/08/2026, a la demande.
  #
  # Ce qui a change depuis son retrait : la cascade ne compte plus qu'UN SEUL
  # palier gratuit reellement actif (Cloudflare). Groq, qu'on croyait gratuit et
  # disponible, n'expose aucun modele de vision — verifie par sonde. Tout ce que
  # Cloudflare ne traite pas tombe donc sur du payant, et c'etait 57 % des
  # requetes lors de la mesure du 31/08.
  #
  # ⚠ CE QU'IL COUTE, DIT D'AVANCE. Inference CPU : plusieurs SECONDES par image,
  # la ou Cloudflare repond en centaines de millisecondes sur GPU. Il est donc
  # place APRES Cloudflare dans l'ordre par defaut, jamais devant. L'image et le
  # modele pesent environ 10 Go de disque.
  #
  # ⚠ LE MODELE N'EST PAS TIRE AUTOMATIQUEMENT. Apres le premier demarrage :
  #     docker compose exec ollama ollama pull moondream
  # Tant qu'aucun modele n'est tire, `tryOllama` recoit une erreur et rend
  # `null` : la cascade continue, mais le palier ne sert a rien. Verifier avec
  #     docker compose exec ollama ollama list
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Aucun port publie : seul le backend l'appelle, par le reseau interne.
    # L'exposer donnerait un LLM ouvert a tout Internet, sans authentification.
    expose: ["11434"]
    volumes: [salorie_ollama:/root/.ollama]
    environment:
      # Decharge le modele apres cinq minutes d'inactivite : sur un VPS partage,
      # garder 2 Go de RAM occupes pour un palier rarement sollicite prive les
      # autres services.
      OLLAMA_KEEP_ALIVE: 5m

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo, redis]
    environment:
      PORT: 4000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/salorie}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      # Ecrire une variable dans le .env du serveur ne suffit PAS : Compose n'injecte que
      # ce qui est liste ici. Constate le 13 aout 2026 — ADMIN_API_KEY etait bien dans le
      # .env (64 caracteres) et absente du conteneur. Consequence : le webhook du pipeline
      # refusait tout le monde, y compris l'outbox interne qui livre sur ce meme endpoint.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Cle partagee avec l'Email Worker Cloudflare (support@salorie.com →
      # POST /support-mail/ingest). Vide = endpoint ferme (403).
      MAIL_INGEST_KEY: ${MAIL_INGEST_KEY:-}
      # Sentry — surveillance des erreurs serveur. Le DSN n'est PAS un secret
      # (ecriture seule, concu pour etre embarque cote client) : sa valeur par
      # defaut vit dans src/instrument.ts. Ces deux lignes ne servent qu'a la
      # surcharger, ou a la VIDER (chaine vide = Sentry desactive). Sans elles,
      # meme presentes dans le .env du serveur, les variables n'atteindraient
      # jamais le conteneur — exactement le piege paye avec ADMIN_API_KEY.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Cle Maps SERVEUR pour Routes API, deplacee du telephone vers le backend le
      # 14 aout 2026. Repli seulement : la valeur prioritaire vient de l'admin /ai-keys
      # via SecretsService, donc modifiable sans redeploiement.
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
      # `gemini-2.0-flash-lite` a ete RETIRE par Google : l'API repond
      # « 404 this model is no longer available » meme avec une cle valide. Verifie le
      # 13 aout 2026. On passe a l'alias `-latest`, qui suit les versions et ne perime pas.
      # (Le compte Gemini est par ailleurs sans credits — 429 RESOURCE_EXHAUSTED.)
      GEMINI_LITE_MODEL: ${GEMINI_LITE_MODEL:-gemini-flash-lite-latest}
      INSIGHTS_CRON: 0 3 * * *
      # Repli optionnel : API food gratuite (option 3). Vide = désactivé.
      FOOD_VISION_API_URL: ${FOOD_VISION_API_URL:-}
      FOOD_VISION_API_KEY: ${FOOD_VISION_API_KEY:-}
      # Outbox webhook : défaut = sink interne public ; override par ${OUTBOX_WEBHOOK_URL}.
      # Bascule sur le domaine PROPRE le 14 aout 2026 — l'ancien api.salorie.salistar.com
      # repond encore, mais dependre d'un domaine herite pour une boucle interne n'a
      # aucun interet.
      OUTBOX_WEBHOOK_URL: ${OUTBOX_WEBHOOK_URL:-https://api.salorie.com/pipeline/webhook-sink}
    volumes: [salorie_uploads:/data/uploads]
    # Port 4000 NON publie sur l'hote : le proxy Caddy le tient deja et relaie en
    # interne. Le publier ici provoque `Bind for 0.0.0.0:4000 failed: port is already
    # allocated` et coupe l'API — constate en production le 3 aout 2026.
    container_name: salorie-backend
    networks: [default, edge]

  web:
    # Caddy relaie vers `salorie-web:3000` sur le reseau externe `edge`. Sans nom
    # fixe ni rattachement, Compose cree `salorie-stack-web-1` et l'admin devient
    # injoignable — constate en production le 3 aout 2026.
    container_name: salorie-web
    networks: [default, edge]
    build:
      # Contexte = racine du depot (et non `./web`) : les pages de /me importent
      # des modules de calcul de `lib/` et deux tables de `assets/data/`. Voir
      # l'entete de web/Dockerfile et le .dockerignore racine.
      context: .
      dockerfile: web/Dockerfile
      args:
        # Doit être un ARG de BUILD : Next.js fige les `NEXT_PUBLIC_*` dans le bundle.
        # Fournie en `environment:` elle n'atteindrait jamais le navigateur, et la carte
        # de l'écran Courses resterait inerte sans le moindre message d'erreur.
        NEXT_PUBLIC_GMAP_KEY: ${NEXT_PUBLIC_GMAP_KEY:-}
        # Espace personnel /me (14 aout 2026). Meme instance Clerk et meme projet
        # Firebase que l'app mobile : c'est ce qui fait que le compte web EST le
        # compte telephone, sans aucun mecanisme de synchronisation a ecrire.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_TOKEN_URL: ${NEXT_PUBLIC_FIREBASE_TOKEN_URL:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.salorie.com}
    restart: unless-stopped
    depends_on: [backend, mongo]
    environment:
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      # NEXT_PUBLIC_API_URL retirée le 5 août 2026 : déclarée ici mais lue NULLE PART dans
      # web/. Elle était de surcroît inopérante par construction — un `NEXT_PUBLIC_*` fourni
      # au runtime n'atteint jamais le navigateur (Next.js les fige au build, cf. le bloc
      # `build.args` ci-dessus). L'admin joint le backend par ses routes serveur.
      # Auth admin (mongoose + JWT) — DOIT être présent sinon login/register cassent.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/salorie}
      AUTH_SECRET: ${AUTH_SECRET}
      # Cle d'installation admin. `/api/auth/register` la lit pour autoriser la
      # creation d'un compte alors qu'il en existe deja — la SEULE issue quand le
      # mot de passe du back-office est perdu, puisque les mots de passe sont en
      # bcrypt et qu'aucun n'est lisible. Elle n'etait cablee NULLE PART : ni ici,
      # ni dans le workflow, d'ou « aucune cle d'installation n'est configuree ».
      # Vide = inscription fermee, ce qui reste le bon defaut.
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      # ADMIN_USER / ADMIN_PASS retirés le 5 août 2026 : plus AUCUNE lecture dans le code
      # (l'auth admin passe par Mongo + bcrypt via lib/adminAuth.ts, cf. AUTH_SECRET).
      # Les garder revenait à réécrire un mot de passe en clair dans le .env du serveur
      # à chaque déploiement, sans qu'il serve à quoi que ce soit.
    ports: ["3000:3000"]

volumes:
  salorie_mongo:
  salorie_ollama:
  salorie_uploads:

networks:
  # Reseau partage avec le proxy Caddy, cree hors de cette stack.
  # Caddy relaie vers `salorie-backend:4000` : sans nom de conteneur fixe NI
  # rattachement a ce reseau, le backend est injoignable et l'API renvoie 502.
  edge:
    external: true
