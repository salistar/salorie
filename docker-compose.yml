# Salorie full stack: MongoDB + Redis + MinIO (file storage) + NestJS API + Next.js admin.
# Usage:  FIREBASE_SERVICE_ACCOUNT='<json>' docker compose up -d --build
services:
  # Datastores are NOT published to the host — only the backend reaches them over
  # the internal docker network (mongo:27017, redis:6379, minio:9000). Keeps them
  # off the public internet.
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [salorie_mongo:/data/db]
    expose: ["27017"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose: ["6379"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-salorie}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-salorie-secret}
    volumes: [salorie_minio:/data]
    expose: ["9000", "9001"]

  # Modèle de vision LOCAL auto-hébergé (tier "Backend" du scan aliment) — CPU.
  # Le modèle est tiré après le démarrage : docker compose exec ollama ollama pull moondream
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [salorie_ollama:/root/.ollama]
    expose: ["11434"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo, redis, minio, ollama]
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/salorie
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
      GEMINI_LITE_MODEL: gemini-2.0-flash-lite
      INSIGHTS_CRON: 0 3 * * *
      # Vision backend local (Ollama) — tier "Backend" du scan, distinct de Gemini.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      # Repli optionnel : API food gratuite (option 3). Vide = désactivé.
      FOOD_VISION_API_URL: ${FOOD_VISION_API_URL:-}
      FOOD_VISION_API_KEY: ${FOOD_VISION_API_KEY:-}
      # Outbox webhook : défaut = sink interne public ; override par ${OUTBOX_WEBHOOK_URL}.
      OUTBOX_WEBHOOK_URL: ${OUTBOX_WEBHOOK_URL:-https://api.salorie.salistar.com/pipeline/webhook-sink}
    volumes: [salorie_uploads:/data/uploads]
    # Port 4000 NON publie sur l'hote : le proxy Caddy le tient deja et relaie en
    # interne. Le publier ici provoque `Bind for 0.0.0.0:4000 failed: port is already
    # allocated` et coupe l'API — constate en production le 3 aout 2026.
    container_name: salorie-backend
    networks: [default, edge]

  web:
    # Caddy relaie vers `salorie-web:3000` sur le reseau externe `edge`. Sans nom
    # fixe ni rattachement, Compose cree `salorie-stack-web-1` et l'admin devient
    # injoignable — constate en production le 3 aout 2026.
    container_name: salorie-web
    networks: [default, edge]
    build:
      context: ./web
      args:
        # Doit être un ARG de BUILD : Next.js fige les `NEXT_PUBLIC_*` dans le bundle.
        # Fournie en `environment:` elle n'atteindrait jamais le navigateur, et la carte
        # de l'écran Courses resterait inerte sans le moindre message d'erreur.
        NEXT_PUBLIC_GMAP_KEY: ${NEXT_PUBLIC_GMAP_KEY:-}
    restart: unless-stopped
    depends_on: [backend, mongo]
    environment:
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      NEXT_PUBLIC_API_URL: http://backend:4000
      # Auth admin (mongoose + JWT) — DOIT être présent sinon login/register cassent.
      MONGO_URI: mongodb://mongo:27017/salorie
      AUTH_SECRET: ${AUTH_SECRET}
      # Conservés (compat / fallback) :
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-}
    ports: ["3000:3000"]

volumes:
  salorie_mongo:
  salorie_minio:
  salorie_uploads:
  salorie_ollama:

networks:
  # Reseau partage avec le proxy Caddy, cree hors de cette stack.
  # Caddy relaie vers `salorie-backend:4000` : sans nom de conteneur fixe NI
  # rattachement a ce reseau, le backend est injoignable et l'API renvoie 502.
  edge:
    external: true
