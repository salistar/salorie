# Salorie full stack: MongoDB + Redis + Ollama + NestJS API + Next.js admin.
# Usage:  FIREBASE_SERVICE_ACCOUNT='<json>' docker compose up -d --build
services:
  # Datastores are NOT published to the host — only the backend reaches them over
  # the internal docker network (mongo:27017, redis:6379, minio:9000). Keeps them
  # off the public internet.
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [salorie_mongo:/data/db]
    expose: ["27017"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose: ["6379"]

  # MinIO retire le 13 aout 2026. Il tournait depuis l'origine sans jamais servir :
  # AUCUNE reference a minio, a un bucket ou a un client S3 dans backend/src. Le stockage
  # de fichiers passe par le disque local (`UPLOAD_DIR`, cf. files.controller.ts:10-24),
  # et son commentaire ligne 16 le dit deja : « swap for MinIO/S3 in prod ». Ce basculement
  # n'a jamais eu lieu. Son volume ne contenait que ses propres metadonnees (136 Ko).
  # Cout du maintien : 241 Mo d'image + 144 Mo de RAM + une surface d'attaque.
  # Pour le remettre : restaurer ce service ET brancher files.controller.ts dessus.

  # Modèle de vision LOCAL auto-hébergé (tier "Backend" du scan aliment) — CPU.
  # Le modèle est tiré après le démarrage : docker compose exec ollama ollama pull moondream
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [salorie_ollama:/root/.ollama]
    expose: ["11434"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo, redis, ollama]
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/salorie
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      # Ecrire une variable dans le .env du serveur ne suffit PAS : Compose n'injecte que
      # ce qui est liste ici. Constate le 13 aout 2026 — ADMIN_API_KEY etait bien dans le
      # .env (64 caracteres) et absente du conteneur. Consequence : le webhook du pipeline
      # refusait tout le monde, y compris l'outbox interne qui livre sur ce meme endpoint.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
      # `gemini-2.0-flash-lite` a ete RETIRE par Google : l'API repond
      # « 404 this model is no longer available » meme avec une cle valide. Verifie le
      # 13 aout 2026. On passe a l'alias `-latest`, qui suit les versions et ne perime pas.
      # (Le compte Gemini est par ailleurs sans credits — 429 RESOURCE_EXHAUSTED.)
      GEMINI_LITE_MODEL: ${GEMINI_LITE_MODEL:-gemini-flash-lite-latest}
      INSIGHTS_CRON: 0 3 * * *
      # Vision backend local (Ollama) — tier "Backend" du scan, distinct de Gemini.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      # Repli optionnel : API food gratuite (option 3). Vide = désactivé.
      FOOD_VISION_API_URL: ${FOOD_VISION_API_URL:-}
      FOOD_VISION_API_KEY: ${FOOD_VISION_API_KEY:-}
      # Outbox webhook : défaut = sink interne public ; override par ${OUTBOX_WEBHOOK_URL}.
      OUTBOX_WEBHOOK_URL: ${OUTBOX_WEBHOOK_URL:-https://api.salorie.salistar.com/pipeline/webhook-sink}
    volumes: [salorie_uploads:/data/uploads]
    # Port 4000 NON publie sur l'hote : le proxy Caddy le tient deja et relaie en
    # interne. Le publier ici provoque `Bind for 0.0.0.0:4000 failed: port is already
    # allocated` et coupe l'API — constate en production le 3 aout 2026.
    container_name: salorie-backend
    networks: [default, edge]

  web:
    # Caddy relaie vers `salorie-web:3000` sur le reseau externe `edge`. Sans nom
    # fixe ni rattachement, Compose cree `salorie-stack-web-1` et l'admin devient
    # injoignable — constate en production le 3 aout 2026.
    container_name: salorie-web
    networks: [default, edge]
    build:
      context: ./web
      args:
        # Doit être un ARG de BUILD : Next.js fige les `NEXT_PUBLIC_*` dans le bundle.
        # Fournie en `environment:` elle n'atteindrait jamais le navigateur, et la carte
        # de l'écran Courses resterait inerte sans le moindre message d'erreur.
        NEXT_PUBLIC_GMAP_KEY: ${NEXT_PUBLIC_GMAP_KEY:-}
    restart: unless-stopped
    depends_on: [backend, mongo]
    environment:
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      # NEXT_PUBLIC_API_URL retirée le 5 août 2026 : déclarée ici mais lue NULLE PART dans
      # web/. Elle était de surcroît inopérante par construction — un `NEXT_PUBLIC_*` fourni
      # au runtime n'atteint jamais le navigateur (Next.js les fige au build, cf. le bloc
      # `build.args` ci-dessus). L'admin joint le backend par ses routes serveur.
      # Auth admin (mongoose + JWT) — DOIT être présent sinon login/register cassent.
      MONGO_URI: mongodb://mongo:27017/salorie
      AUTH_SECRET: ${AUTH_SECRET}
      # ADMIN_USER / ADMIN_PASS retirés le 5 août 2026 : plus AUCUNE lecture dans le code
      # (l'auth admin passe par Mongo + bcrypt via lib/adminAuth.ts, cf. AUTH_SECRET).
      # Les garder revenait à réécrire un mot de passe en clair dans le .env du serveur
      # à chaque déploiement, sans qu'il serve à quoi que ce soit.
    ports: ["3000:3000"]

volumes:
  salorie_mongo:
  salorie_uploads:
  salorie_ollama:

networks:
  # Reseau partage avec le proxy Caddy, cree hors de cette stack.
  # Caddy relaie vers `salorie-backend:4000` : sans nom de conteneur fixe NI
  # rattachement a ce reseau, le backend est injoignable et l'API renvoie 502.
  edge:
    external: true
