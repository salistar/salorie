# DNS Cloudflare, a la demande.
# ---------------------------------------------------------------------------
# Le poste de travail n'a aucun identifiant Cloudflare ; le depot, si
# (`CF_API_TOKEN`). Ce workflow EST donc l'acces au DNS, comme `vps-exec` l'est
# au serveur. Cree le 20/08/2026 pour poser l'enregistrement `www` manquant.
#
# Le jeton n'est jamais affiche : il ne circule qu'en en-tete `curl`, et les
# reponses sont filtrees pour ne sortir que ce qui est demande.
name: Cloudflare DNS
on:
  workflow_dispatch:
    inputs:
      action:
        description: "verifier | lister | poser"
        required: true
        default: verifier
        type: choice
        options: [verifier, lister, poser]
      nom:
        description: "Sous-domaine pour 'poser' (ex: www, turn)"
        required: false
        default: www
        type: string
      valeur:
        description: "Cible pour 'poser' (IPv4, ou nom pour un CNAME)"
        required: false
        default: "46.225.77.64"
        type: string

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF: ${{ secrets.CF_API_TOKEN }}
      ZONE_NOM: salorie.com
    steps:
      - name: Verifier le jeton
        run: |
          R=$(curl -s -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "  jeton : $(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), (d.get("result") or {}).get("status"), [e.get("message") for e in d.get("errors",[])])')"

      - name: Trouver la zone
        id: zone
        run: |
          R=$(curl -s -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NOM")
          ID=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if r else "")')
          if [ -z "$ID" ]; then
            echo "  zone $ZONE_NOM INTROUVABLE — le jeton n a probablement pas le droit Zone:Read"
            echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("  erreurs:", [e.get("message") for e in d.get("errors",[])])'
          else
            echo "  zone trouvee"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Lister les enregistrements
        if: ${{ inputs.action != 'verifier' && steps.zone.outputs.id != '' }}
        run: |
          curl -s -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.id }}/dns_records?per_page=100" \
          | python3 -c '
import sys, json
d = json.load(sys.stdin)
for r in sorted(d.get("result") or [], key=lambda x: x["name"]):
    print("  %-6s %-30s -> %-28s proxy=%s" % (r["type"], r["name"], r["content"], r.get("proxied")))
'

      - name: Poser l enregistrement
        if: ${{ inputs.action == 'poser' && steps.zone.outputs.id != '' }}
        run: |
          NOM="${{ inputs.nom }}"; VAL="${{ inputs.valeur }}"
          case "$VAL" in *[a-zA-Z]*) TYPE=CNAME;; *) TYPE=A;; esac
          Z="${{ steps.zone.outputs.id }}"
          EXIST=$(curl -s -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/zones/$Z/dns_records?name=$NOM.$ZONE_NOM" \
            | python3 -c 'import sys,json; r=(json.load(sys.stdin).get("result") or []); print(r[0]["id"] if r else "")')
          CORPS=$(printf '{"type":"%s","name":"%s","content":"%s","ttl":1,"proxied":false}' "$TYPE" "$NOM" "$VAL")
          if [ -n "$EXIST" ]; then
            echo "  $NOM existe deja -> mise a jour"
            M=PUT; U="https://api.cloudflare.com/client/v4/zones/$Z/dns_records/$EXIST"
          else
            echo "  $NOM absent -> creation ($TYPE vers $VAL)"
            M=POST; U="https://api.cloudflare.com/client/v4/zones/$Z/dns_records"
          fi
          curl -s -X $M -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
            --data "$CORPS" "$U" \
          | python3 -c '
import sys, json
d = json.load(sys.stdin)
if d.get("success"):
    r = d["result"]; print("  OK : %s %s -> %s (proxy=%s)" % (r["type"], r["name"], r["content"], r.get("proxied")))
else:
    print("  ECHEC :", [e.get("message") for e in d.get("errors", [])])
'
