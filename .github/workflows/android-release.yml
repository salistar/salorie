# Build RELEASE signé (AAB pour Play + APK installable) — Salorie
#
# Pourquoi ce workflow existe : `android-build.yml` ne produit qu'un APK **debug**, non
# signable pour le Play Store. La seule machine capable de fabriquer un binaire publiable
# était donc le poste de développement, avec le keystore stocké nulle part ailleurs. Si ce
# disque meurt, plus aucune mise à jour ne peut être publiée — Google n'accepte QUE des
# binaires signés par la même clé, sans recours possible.
#
# Ici la clé vit dans les secrets GitHub, chiffrés au repos et jamais visibles dans les
# logs. Le fichier est reconstitué à la volée puis SUPPRIMÉ, même si le build échoue.
#
# SECRETS À CRÉER (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64   le .jks encodé en base64  (voir salorie-upload.jks.base64)
#   ANDROID_KEYSTORE_PASSWORD mot de passe du magasin
#   ANDROID_KEY_ALIAS         alias de la clé (« salorie »)
#   ANDROID_KEY_PASSWORD      mot de passe de la clé
#   GMAPS_ANDROID_KEY         clé Maps — sinon la carte est inerte (build OK quand même)
name: Salorie Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Produire aussi un APK installable (en plus de l AAB)'
        type: boolean
        default: true

jobs:
  release:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    # Déclarées au niveau du JOB, pas d'une étape : Gradle relance lui-même le bundler
    # (tâche `createBundleReleaseJsAndAssets`) et ÉCRASE le bundle produit par
    # `expo export:embed`. Les poser uniquement sur l'étape de bundle donnait un APK
    # qui plantait au démarrage sur `auth/invalid-api-key` — constaté sur appareil le
    # 5 août 2026, alors que le contrôle du bundle intermédiaire était vert.
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      EXPO_PUBLIC_FIREBASE_TOKEN_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_TOKEN_URL }}
      EXPO_PUBLIC_REVENUE_CAT_API_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_REVENUE_CAT_API_KEY_ANDROID }}
      EXPO_PUBLIC_REVENUE_CAT_API_KEY_IOS: ${{ secrets.EXPO_PUBLIC_REVENUE_CAT_API_KEY_IOS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Même nettoyage que le workflow debug : jest-expo tire des RC de React 19 qui
      # cassent la résolution de modules au bundling.
      - name: Cleanup React 19 RC sub-deps from jest-expo
        run: |
          rm -rf node_modules/jest-expo/node_modules/react
          rm -rf node_modules/jest-expo/node_modules/react-dom
          rm -rf node_modules/jest-expo/node_modules/react-server-dom-webpack
          rm -rf node_modules/jest-expo/node_modules/react-test-renderer
          rm -rf node_modules/jest-expo/node_modules/@types/react

      - name: Disable New Architecture (Bridgeless)
        run: |
          node -e "const f='app.json';const j=JSON.parse(require('fs').readFileSync(f));j.expo.newArchEnabled=false;require('fs').writeFileSync(f,JSON.stringify(j,null,2));"

      # La clé Maps DOIT être présente ici : prebuild régénère AndroidManifest.xml et
      # y injecte `android.config.googleMaps.apiKey` depuis app.config.js.
      - name: Expo prebuild
        env:
          CI: '1'
          GMAPS_ANDROID_KEY: ${{ secrets.GMAPS_ANDROID_KEY }}
        run: npx expo prebuild --platform android --clean

      # `expo export:embed` FIGE la valeur de chaque `process.env.EXPO_PUBLIC_*` dans le
      # bundle. `.env` étant gitignoré, il n'existe pas sur le runner : sans les variables
      # du job, les douze valent '' et l'app part sans clé Clerk (connexion impossible),
      # sans Firebase (ni Firestore ni auth) et sans RevenueCat — le build réussissant
      # quand même. Même piège que la clé Maps.
      #
      # Les variables viennent du bloc `env` du JOB : ne pas les redéclarer ici, elles
      # doivent aussi être visibles des étapes Gradle, qui rebundlent.
      - name: Bundle JS (embedded, no Metro)
        run: |
          # Un secret absent ne casse rien à l'exécution du build : il produit une app
          # muette, découverte seulement après publication. On échoue ici, pas sur Play.
          manquants=""
          for v in EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY EXPO_PUBLIC_FIREBASE_API_KEY \
                   EXPO_PUBLIC_FIREBASE_PROJECT_ID EXPO_PUBLIC_FIREBASE_APP_ID; do
            eval "val=\${$v}"
            [ -n "$val" ] || manquants="$manquants $v"
          done
          if [ -n "$manquants" ]; then
            echo "Secrets GitHub absents :$manquants"
            echo "L'AAB serait construit sans ces clés — connexion et base de données inertes."
            exit 1
          fi
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache

      # NE PAS remettre ici un contrôle du bundle intermédiaire : Gradle le RÉÉCRIT plus
      # loin. Un tel contrôle passait au vert alors que l'APK final était inutilisable.
      # La vérification se fait désormais sur l'artefact livré (voir après Gradle).

      # Le keystore n'existe que le temps du build. `base64 -d` lit depuis un fichier
      # temporaire plutôt qu'un echo, pour ne jamais faire transiter le secret par une
      # ligne de commande visible dans les traces de processus.
      - name: Restore keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" > /tmp/ks.b64
          base64 -d /tmp/ks.b64 > android/app/salorie-upload.jks
          rm -f /tmp/ks.b64
          test -s android/app/salorie-upload.jks || { echo "Keystore vide — secret absent ou mal encodé"; exit 1; }

      # arm-only : x86/x86_64 ne servent qu'aux émulateurs et pèsent ~89 Mo pour zéro
      # utilisateur réel.
      # Le préfixe ORG_GRADLE_PROJECT_ n'est pas décoratif : c'est le SEUL moyen pour une
      # variable d'environnement de devenir une propriété de projet Gradle. Sans lui,
      # `project.hasProperty('MYAPP_RELEASE_STORE_FILE')` est faux et la configuration de
      # signature reste vide — vérifié le 3 août 2026 par un projet Gradle témoin.
      # Le garde de withReleaseSigning.js fait alors échouer le build, ce qui est voulu.
      - name: Gradle bundleRelease (AAB signé)
        env:
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_FILE: salorie-upload.jks
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Gradle assembleRelease (APK installable)
        if: github.event_name == 'push' || inputs.build_apk
        env:
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_FILE: salorie-upload.jks
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Contrôle SUR L'ARTEFACT LIVRÉ — le seul qui prouve quelque chose.
      #
      # Le bundle embarqué est du bytecode Hermes, mais Hermes conserve les littéraux de
      # chaîne dans sa table : un `grep` binaire y retrouve la clé. Vérifié le 5 août 2026
      # en comparant un APK sain (clé trouvée) à l'APK cassé de la CI (aucune occurrence
      # de `AIzaSy`), lui-même confirmé par un `auth/invalid-api-key` sur appareil.
      - name: Vérifier les clés dans l'AAB livré
        env:
          CLE: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: |
          AAB=$(find android/app/build/outputs/bundle -name '*.aab' | head -1)
          test -n "$AAB" || { echo "Aucun AAB produit."; exit 1; }
          rm -rf /tmp/aabx && mkdir -p /tmp/aabx
          unzip -o -q "$AAB" -d /tmp/aabx
          B=$(find /tmp/aabx -name 'index.android.bundle' | head -1)
          test -n "$B" || { echo "Bundle introuvable dans l'AAB."; exit 1; }
          if grep -aqF "$CLE" "$B"; then
            echo "Clé Firebase présente dans l'AAB livré."
          else
            echo "Clé Firebase ABSENTE de l'AAB : l'app planterait au démarrage"
            echo "(auth/invalid-api-key). Gradle a probablement rebundlé sans l'environnement."
            exit 1
          fi

      # `if: always()` : le keystore doit disparaître du runner même si Gradle a échoué.
      - name: Wipe keystore
        if: always()
        run: rm -f android/app/salorie-upload.jks

      # Contrôle de l'IDENTITÉ du signataire, pas de l'existence d'une signature.
      #
      # La version précédente cherchait un bloc de signature dans META-INF. Une signature
      # de DEBUG satisfait ce test : c'est exactement pourquoi elle a validé les AAB de
      # v1.0.0-rc1, rc2 et rc3, tous signés `CN=Android Debug` et donc refusables par
      # Play. Le gabarit Expo écrit `signingConfig signingConfigs.debug` dans le bloc
      # release, et `prebuild --clean` effaçait la configuration de production.
      #
      # Le vrai contrôle compare l'empreinte du certificat à celle attendue. Une empreinte
      # de certificat n'est pas un secret : Play l'affiche publiquement.
      - name: Verify signature
        env:
          # Empreinte du keystore d'upload de Salorie. Si elle change, c'est que la clé a
          # change — et une clé differente signifie qu'aucune mise a jour ne pourra plus
          # etre publiee. Ce test doit alors echouer bruyamment.
          EXPECTED_SHA256: '8F:97:78:6D:56:97:48:0D:96:FB:18:8E:23:14:94:3B:7B:58:67:C2:8D:6E:7E:FF:E2:7D:6F:B8:A0:65:38:E3'
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "AAB introuvable"; exit 1; }

          # Langue forcée : keytool traduit ses étiquettes. Sur une machine française il
          # écrit « Propriétaire: », et un grep sur "Owner:" ne trouve rien — le contrôle
          # passerait alors sans rien contrôler. Constaté en écrivant cette étape.
          CERT=$(keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$AAB" 2>/dev/null)
          if [ -z "$CERT" ]; then
            echo "AAB NON SIGNÉ — aucun certificat lisible. Vérifier les secrets."
            exit 1
          fi

          OWNER=$(echo "$CERT" | grep -m1 'Owner:')
          SHA=$(echo "$CERT" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' \r')
          echo "$OWNER"
          echo "SHA-256: $SHA"

          case "$OWNER" in
            *'Android Debug'*)
              echo "ÉCHEC : AAB signé avec la clé de DEBUG. Google Play le refusera."
              echo "Cause probable : la configuration de signature release a disparu du"
              echo "build.gradle régénéré. Vérifier le plugin plugins/withReleaseSigning.js."
              exit 1
              ;;
          esac

          if [ "$SHA" != "$EXPECTED_SHA256" ]; then
            echo "ÉCHEC : empreinte inattendue."
            echo "  attendue : $EXPECTED_SHA256"
            echo "  obtenue  : $SHA"
            echo "Si le changement est voulu, mettre à jour EXPECTED_SHA256 ci-dessus."
            exit 1
          fi

          echo "AAB signé avec la clé de production — $(du -h "$AAB" | cut -f1)"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: salorie-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload APK
        if: github.event_name == 'push' || inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: salorie-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
