name: Caddyfile — derive

# La copie de `infra/Caddyfile` n'est PAS deployee (voir infra/README.md) : elle
# existe pour que la topologie survive a la machine. Sans ce controle, elle se
# demoderait en silence — et on lirait une topologie qui n'est plus vraie, ce qui
# est pire que de n'en avoir aucune, parce qu'on lui ferait confiance.
#
# Ne publie JAMAIS le contenu du fichier, seulement son empreinte.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['infra/Caddyfile', '.github/workflows/caddy-derive.yml']

concurrency:
  group: caddy-derive
  cancel-in-progress: true

jobs:
  comparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empreinte de la copie du depot
        id: depot
        run: echo "sha=$(sha256sum infra/Caddyfile | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # ⚠ LA COMPARAISON SE FAIT SUR LE SERVEUR, ET C'EST DELIBERE.
      # `appleboy/ssh-action` n'expose pas la sortie du script comme `outputs` :
      # une premiere version lisait `steps.<id>.outputs.stdout`, qui arrivait
      # VIDE, et le controle echouait en accusant le conteneur caddy d'etre
      # muet. On envoie donc l'empreinte attendue par `envs:` — le mecanisme
      # prevu par l'action, celui que ce depot a deja appris a utiliser pour le
      # SHA du deploiement — et c'est le serveur qui tranche par son code de
      # sortie.
      - name: Comparer avec le fichier servi par Caddy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA_DEPOT: ${{ steps.depot.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA_DEPOT
          script: |
            F=$(docker inspect caddy --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}')
            if [ -z "$F" ] || [ ! -f "$F" ]; then
              echo "Caddyfile introuvable — le conteneur caddy repond-il ?"
              exit 1
            fi
            SHA_SERVEUR=$(sha256sum "$F" | cut -d' ' -f1)
            echo "depot   : $SHA_DEPOT"
            echo "serveur : $SHA_SERVEUR"
            if [ "$SHA_DEPOT" != "$SHA_SERVEUR" ]; then
              echo "DERIVE : le Caddyfile du serveur differe de la copie du depot."
              echo "Quelqu un a modifie la topologie sans la reporter — ou l inverse."
              echo "Recuperer le fichier servi, le relire, puis mettre infra/Caddyfile a jour."
              exit 1
            fi
            echo "identiques"
