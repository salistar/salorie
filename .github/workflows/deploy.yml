name: Deploy stack to VPS

# CI/CD : à chaque push sur main touchant le backend ou le web, on rebuild +
# redéploie les containers concernés sur le VPS (serveur 3) via SSH.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   VPS_HOST     = 46.225.77.64
#   VPS_USER     = root
#   VPS_SSH_KEY  = contenu de la clé privée salistar_srv3
#   VPS_APP_DIR  = /home/deploy/apps/salorie-stack   (optionnel, défaut ci-dessous)

on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', '.github/workflows/deploy.yml']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR || '/home/deploy/apps/salorie-stack' }}
            git pull --rebase --autostash origin main || echo "git pull skipped (not a git checkout)"
            docker compose build backend web
            docker compose up -d backend web
            docker image prune -f
            echo "Deploy OK: $(date)"
