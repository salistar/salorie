name: Infra — origines Clerk, DNS TURN, pare-feu

# Trois corrections d'infrastructure qui ne pouvaient pas se faire depuis un poste
# local : elles demandent la cle SSH du serveur et le jeton Cloudflare, qui ne
# vivent qu'ici, en secrets GitHub.
#
#   1. CLERK — l'instance n'accepte que les origines *.salistar.com. L'espace /me
#      est servi depuis app.salorie.com : la connexion y echoue avec
#      `origin_invalid`. On ajoute le domaine propre aux origines autorisees, via
#      l'API Backend de Clerk. La cle CLERK_SECRET_KEY n'est PAS un secret GitHub :
#      elle vit deja sur le serveur pour le pont de jetons, et n'en sort jamais.
#
#   2. DNS — turn.salorie.com doit pointer vers srv3, en DNS SEUL. Cloudflare ne
#      relaie pas l'UDP : proxifie (nuage orange), le TURN ne fonctionnerait pas.
#
#   3. PARE-FEU — ouvrir UDP 3478 et la plage de relais. Ces regles sont ADDITIVES :
#      `ufw allow` n'a jamais ferme un port ni coupe une session SSH.
#
# Volontairement manuel (`workflow_dispatch`) : ce n'est pas une etape de
# deploiement, c'est une operation qu'on declenche en sachant ce qu'on fait.

on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: "Appliquer les changements (sinon : diagnostic seul)"
        type: boolean
        default: false

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Origines Clerk + pare-feu (sur le serveur)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: APPLIQUER
          script: |
            set -u
            APPLIQUER="${{ inputs.appliquer }}"
            echo "=============== DIAGNOSTIC ==============="

            echo "--- coturn ---"
            docker ps --format '{{.Names}}\t{{.Status}}' | grep -i turn || echo "coturn absent"
            # `ss` dit la verite sur ce qui ecoute REELLEMENT, contrairement au
            # statut du conteneur : coturn peut tourner sans avoir pu se lier.
            (sudo ss -lnu 2>/dev/null || ss -lnu) | grep -E ':3478' || echo "rien n ecoute sur UDP 3478"

            echo "--- pare-feu ---"
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw status | head -20 || echo "ufw non interrogeable"
            else
              echo "ufw absent — le filtrage vient peut-etre de l hebergeur, hors de portee d ici"
            fi

            echo "--- cle Clerk disponible sur le serveur ? ---"
            # On cherche le .env du pont de jetons sans JAMAIS afficher la valeur.
            CHEMIN_ENV=""
            for c in /home/deploy/apps/*/firebase-token/.env /home/deploy/*/firebase-token/.env /opt/*/firebase-token/.env; do
              [ -f "$c" ] && CHEMIN_ENV="$c" && break
            done
            if [ -n "$CHEMIN_ENV" ]; then
              echo "trouve : $CHEMIN_ENV"
              grep -q '^CLERK_SECRET_KEY=' "$CHEMIN_ENV" && echo "CLERK_SECRET_KEY : presente" || echo "CLERK_SECRET_KEY : ABSENTE"
            else
              echo "aucun .env de pont de jetons trouve"
            fi

            if [ "$APPLIQUER" != "true" ]; then
              echo "=== diagnostic seul — rien n a ete modifie ==="
              exit 0
            fi

            echo "=============== APPLICATION ==============="

            echo "--- pare-feu : ouverture (additive) ---"
            if command -v ufw >/dev/null 2>&1 && sudo ufw status | grep -qi '^Status: active'; then
              sudo ufw allow 3478/udp  comment 'TURN Salorie'
              sudo ufw allow 3478/tcp  comment 'TURN Salorie'
              sudo ufw allow 49160:49200/udp comment 'TURN relais Salorie'
              sudo ufw status | grep -E '3478|49160' || true
            else
              echo "ufw inactif ou absent : rien a ouvrir ici. Si 3478 reste ferme depuis"
              echo "l exterieur, le filtrage est celui de l hebergeur (panneau du VPS)."
            fi

            echo "--- Clerk : ajout des origines du domaine propre ---"
            if [ -n "$CHEMIN_ENV" ] && grep -q '^CLERK_SECRET_KEY=' "$CHEMIN_ENV"; then
              CSK="$(grep -m1 '^CLERK_SECRET_KEY=' "$CHEMIN_ENV" | cut -d= -f2-)"
              # `allowed_origins` REMPLACE la liste : on repart donc de l'existante
              # et on y ajoute, sinon on couperait l'acces aux domaines actuels.
              ACTUELLES="$(curl -s -H "Authorization: Bearer $CSK" https://api.clerk.com/v1/instance \
                | sed -n 's/.*"allowed_origins":\[\([^]]*\)\].*/\1/p')"
              echo "origines actuelles : ${ACTUELLES:-<vide>}"
              NOUVELLES='"https://app.salorie.com","https://salorie.com","https://www.salorie.com"'
              [ -n "$ACTUELLES" ] && LISTE="$ACTUELLES,$NOUVELLES" || LISTE="$NOUVELLES"
              CODE=$(curl -s -o /tmp/clerk.json -w '%{http_code}' -X PATCH https://api.clerk.com/v1/instance \
                -H "Authorization: Bearer $CSK" -H 'Content-Type: application/json' \
                -d "{\"allowed_origins\":[$LISTE]}")
              echo "reponse Clerk : HTTP $CODE"
              head -c 400 /tmp/clerk.json; echo
              rm -f /tmp/clerk.json
            else
              echo "CLERK_SECRET_KEY introuvable : etape sautee (rien de casse)."
            fi

      - name: DNS turn.salorie.com (Cloudflare, DNS seul)
        if: ${{ inputs.appliquer }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -u
          api() { curl -s -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "$@"; }

          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=salorie.com" \
            | sed -n 's/.*"id":"\([a-f0-9]\{32\}\)".*/\1/p' | head -1)
          if [ -z "$ZONE" ]; then
            echo "::warning::Zone salorie.com introuvable — le jeton Cloudflare n a probablement"
            echo "::warning::que la permission Workers AI, pas Zone:DNS:Edit. Ajoute l enregistrement"
            echo "::warning::a la main : turn.salorie.com  A  $VPS_HOST  (nuage GRIS, DNS only)."
            exit 0
          fi
          echo "zone trouvee : $ZONE"

          EXISTANT=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=turn.salorie.com" \
            | sed -n 's/.*"id":"\([a-f0-9]\{32\}\)".*/\1/p' | head -1)
          # `proxied: false` est OBLIGATOIRE : Cloudflare ne relaie pas l UDP, et un
          # enregistrement proxifie ferait pointer le client vers un edge qui ne
          # parle pas TURN.
          CORPS="{\"type\":\"A\",\"name\":\"turn\",\"content\":\"$VPS_HOST\",\"ttl\":300,\"proxied\":false}"

          if [ -n "$EXISTANT" ]; then
            echo "enregistrement deja present — mise a jour"
            api -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$EXISTANT" -d "$CORPS" | head -c 300
          else
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" -d "$CORPS" | head -c 300
          fi
          echo
