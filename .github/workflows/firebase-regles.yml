# Deploiement des regles Firestore et Storage.
# ---------------------------------------------------------------------------
# POURQUOI CE WORKFLOW EXISTE
#
# `firestore.rules` (409 lignes) et `storage.rules` vivaient dans le depot sans
# que RIEN ne les deploie — verifie le 22/08/2026. Le fichier versionne pouvait
# donc differer de ce qui protege reellement les donnees, et personne ne l'aurait
# su : on relit le depot, on se rassure, et la base obeit a une autre version.
#
# C'est le pire genre d'ecart en securite — celui qu'on ne peut pas voir en
# lisant le code.
#
# Le service ne demande aucun secret nouveau : `FIREBASE_SERVICE_ACCOUNT` existe
# deja pour le backend.
name: Firebase — regles

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'firebase.json', '.github/workflows/firebase-regles.yml']
  workflow_dispatch: {}

jobs:
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verifier que les fichiers sont la
        run: |
          for f in firestore.rules storage.rules firebase.json; do
            [ -f "$f" ] || { echo "::error::$f manquant"; exit 1; }
            echo "  $f : $(wc -l < "$f") lignes"
          done

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Deployer
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${SA:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT absent des secrets."
            exit 1
          fi
          # Le compte de service passe par un FICHIER et la variable que la CLI
          # attend : le coller dans une ligne de commande le rendrait visible de
          # tout processus de la machine via `ps`.
          printf '%s' "$SA" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # Le projet est lu du compte de service : pas de valeur en dur qui
          # pourrait pointer ailleurs que la cle utilisee.
          PROJET=$(node -e "process.stdout.write(require('/tmp/sa.json').project_id||'')")
          echo "  projet : $PROJET"
          [ -n "$PROJET" ] || { echo "::error::project_id absent du compte de service"; exit 1; }
          # ⚠ `| tail` MASQUE le code de sortie : le statut du tube est celui de
          # `tail`, donc toujours 0. Ma premiere version faisait exactement cela et
          # a rapporte « success » sur un deploiement en erreur 403. `pipefail`
          # rend au tube le code de la commande qui a echoue.
          set -o pipefail

          # Firestore d'abord, et il est OBLIGATOIRE : c'est lui qui protege les
          # donnees des utilisateurs. Un echec ici doit faire echouer le workflow.
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules --project "$PROJET" --non-interactive 2>&1 | tail -20

          # Storage ensuite, et TOLERANT. Le blocage n'est PAS un droit sur les
          # regles : avant de deployer, la CLI verifie que l'API Storage est
          # activee, et cette verification demande `serviceusage.services.get`
          # — que le compte de service n'a pas.
          #
          #   Permission denied to get service firebasestorage.googleapis.com
          #   (sur serviceusage.googleapis.com), constate le 24/08/2026 APRES
          #   l'octroi du role Administrateur des regles Firebase — lequel a
          #   bien debloque Firestore, deploye avec succes le meme jour.
          #
          # J'avais d'abord attribue cet echec au meme droit manquant que
          # Firestore. C'etait faux, et le message ci-dessous l'a repete : il
          # envoyait chercher un role deja accorde.
          #
          # Pour le lever : ajouter au compte de service le role
          # « Lecteur Service Usage » (roles/serviceusage.serviceUsageViewer),
          # dans la console Cloud > IAM. Il est en LECTURE SEULE.
          #
          # Tolerant, parce que faire echouer tout le workflow pour cela
          # empecherait de deployer les regles Firestore, qui comptent davantage.
          if npx --yes firebase-tools@13 deploy \
               --only storage --project "$PROJET" --non-interactive 2>&1 | tail -10; then
            echo "  regles Storage deployees"
          else
            echo "::warning::regles Storage NON deployees. Il manque au compte de service"
            echo "::warning::le role Lecteur Service Usage (serviceusage.services.get)."
            echo "::warning::Ce n est PAS un droit sur les regles : Firestore est bien deploye."
          fi
          rm -f /tmp/sa.json
