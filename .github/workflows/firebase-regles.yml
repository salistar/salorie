# Deploiement des regles Firestore et Storage.
# ---------------------------------------------------------------------------
# POURQUOI CE WORKFLOW EXISTE
#
# `firestore.rules` (409 lignes) et `storage.rules` vivaient dans le depot sans
# que RIEN ne les deploie — verifie le 22/08/2026. Le fichier versionne pouvait
# donc differer de ce qui protege reellement les donnees, et personne ne l'aurait
# su : on relit le depot, on se rassure, et la base obeit a une autre version.
#
# C'est le pire genre d'ecart en securite — celui qu'on ne peut pas voir en
# lisant le code.
#
# Le service ne demande aucun secret nouveau : `FIREBASE_SERVICE_ACCOUNT` existe
# deja pour le backend.
name: Firebase — regles

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'firebase.json', 'scripts/tester-regles-firestore.js', '.github/workflows/firebase-regles.yml']
  workflow_dispatch: {}

jobs:
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verifier que les fichiers sont la
        run: |
          for f in firestore.rules storage.rules firebase.json; do
            [ -f "$f" ] || { echo "::error::$f manquant"; exit 1; }
            echo "  $f : $(wc -l < "$f") lignes"
          done

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # ── Les regles font-elles ce qu'elles disent ? ─────────────────────────
      #
      # Le 24/08/2026, un deploiement a prouve que les regles COMPILENT. Il n'a
      # rien prouve sur leur comportement. Interrogees, elles ont revele que
      # cinq garde-fous contre l'auto-attribution du Premium etaient MORTS
      # depuis leur ecriture : un joker `{document=**}`, 90 lignes plus bas,
      # couvrait aussi le document parent — et Firestore autorise des qu'UNE
      # regle autorise. N'importe qui pouvait s'offrir un abonnement.
      #
      # Rien dans la relecture du fichier ne le montrait.
      #
      # AVANT le deploiement, et bloquant : une regle trop laxiste rouvrirait le
      # trou, une regle trop stricte empecherait les gens d'ecrire leurs repas.
      # Publier d'abord et regarder ensuite, c'est choisir laquelle des deux on
      # fera subir aux utilisateurs.
      - name: Interroger les regles candidates
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/tester-regles-firestore.js firestore.rules

      - name: Deployer
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${SA:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT absent des secrets."
            exit 1
          fi
          # Le compte de service passe par un FICHIER et la variable que la CLI
          # attend : le coller dans une ligne de commande le rendrait visible de
          # tout processus de la machine via `ps`.
          printf '%s' "$SA" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # Le projet est lu du compte de service : pas de valeur en dur qui
          # pourrait pointer ailleurs que la cle utilisee.
          PROJET=$(node -e "process.stdout.write(require('/tmp/sa.json').project_id||'')")
          echo "  projet : $PROJET"
          [ -n "$PROJET" ] || { echo "::error::project_id absent du compte de service"; exit 1; }
          # ⚠ `| tail` MASQUE le code de sortie : le statut du tube est celui de
          # `tail`, donc toujours 0. Ma premiere version faisait exactement cela et
          # a rapporte « success » sur un deploiement en erreur 403. `pipefail`
          # rend au tube le code de la commande qui a echoue.
          set -o pipefail

          # Firestore d'abord, et il est OBLIGATOIRE : c'est lui qui protege les
          # donnees des utilisateurs. Un echec ici doit faire echouer le workflow.
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules --project "$PROJET" --non-interactive 2>&1 | tail -20

          rm -f /tmp/sa.json

      # ── Storage : par l'API, pas par la CLI ───────────────────────────────
      #
      # `firebase deploy --only storage` echouait avec « Permission denied to
      # get service firebasestorage.googleapis.com ». Ce n'est PAS un droit sur
      # les regles : avant de publier, la CLI verifie que l'API Storage est
      # activee, ce qui demande `serviceusage.services.get`. Le compte de
      # service ne l'a pas — mais il a `firebaserules.admin`, c'est-a-dire tout
      # ce qu'il faut pour publier reellement des regles.
      #
      # L'etape etait donc TOLERANTE et n'a jamais rien publie : `storage.rules`
      # pouvait diverger de ce qui protege le bucket sans que personne le voie.
      # C'est exactement l'ecart que ce workflow existe pour supprimer.
      #
      # On s'adresse a l'API directement. Bloquant, desormais : il n'y a plus de
      # raison d'echouer, et un echec silencieux serait pire que pas d'etape.
      - name: Publier les regles Storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/publier-regles-storage.js storage.rules

      # Le meme jeu de questions, mais posees au jeu de regles EN LIGNE. L'etape
      # precedente interroge un fichier ; celle-ci interroge ce que la base
      # applique reellement. Les deux peuvent differer — un deploiement partiel,
      # une publication faite ailleurs — et c'est la seconde qui protege
      # vraiment les donnees.
      - name: Verifier le jeu de regles publie
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/tester-regles-firestore.js
