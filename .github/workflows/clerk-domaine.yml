# Bascule du domaine primaire Clerk, par l'API Backend.
# ---------------------------------------------------------------------------
# POURQUOI CE WORKFLOW EXISTE
#
# Le dialogue « Change domain » du tableau de bord Clerk refuse les clics
# automatises : il ouvre bien, se remplit bien, puis part en GET sans declencher
# sa mutation (constate le 21/08/2026, huit approches differentes). L'API
# Backend, elle, fait la meme chose en un appel — et elle est scriptable.
#
# `action: diagnostic` ne change RIEN : il lit l'etat de l'instance et le dit.
# C'est le mode par defaut, et le seul a lancer sans y avoir reflechi.
#
# ⚠ `action: basculer` INVALIDE TOUTES LES SESSIONS, deconnecte tout le monde et
# coupe le service le temps que le DNS et les certificats suivent. A ne lancer
# qu'apres avoir pose l'URI de redirection Google (fait le 21/08) et en sachant
# que l'APK mobile devra etre reconstruit avec la nouvelle cle publique.
name: Clerk — domaine

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diagnostic (ne change rien) | basculer (coupe le service)"
        required: true
        default: diagnostic
        type: choice
        options: [diagnostic, basculer]
      domaine:
        description: "Nouveau domaine primaire, pour 'basculer'"
        required: false
        default: salorie.com
        type: string

jobs:
  clerk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CSK: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - name: Verifier la cle
        run: |
          if [ -z "${CSK:-}" ]; then
            echo "::error::CLERK_SECRET_KEY absente des secrets du depot."
            exit 1
          fi
          # On n'affiche jamais la cle : seulement ce que le serveur repond.
          CODE=$(curl -s -o /tmp/i.json -w '%{http_code}' \
            -H "Authorization: Bearer $CSK" https://api.clerk.com/v1/instance)
          echo "  GET /v1/instance -> HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::La cle est refusee par Clerk."; exit 1; }

      - name: Etat de l instance
        run: |
          echo "--- domaines ---"
          curl -s -H "Authorization: Bearer $CSK" https://api.clerk.com/v1/domains > /tmp/d.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/d.json'))
          liste = d if isinstance(d, list) else (d.get('data') or [])
          for x in liste:
              print('  %-24s satellite=%-5s frontend=%s' % (
                  x.get('name'), x.get('is_satellite'), x.get('frontend_api_url')))
          if not liste:
              print('  (aucun domaine listable)')
          PY
          echo "--- origines autorisees ---"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/i.json'))
          o = d.get('allowed_origins')
          print('  ' + (', '.join(o) if o else '<vide>'))
          PY

      - name: Basculer le domaine primaire
        if: ${{ inputs.action == 'basculer' }}
        run: |
          echo "::warning::Bascule vers ${{ inputs.domaine }} — toutes les sessions vont tomber."
          CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CSK" -H 'Content-Type: application/json' \
            -d '{"home_url":"https://${{ inputs.domaine }}"}' \
            https://api.clerk.com/v1/instance/change_domain)
          echo "  POST /v1/instance/change_domain -> HTTP $CODE"
          head -c 500 /tmp/r.json; echo
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ] || { echo "::error::Bascule refusee."; exit 1; }

      - name: Ce qu il faut faire ensuite
        if: ${{ inputs.action == 'basculer' }}
        run: |
          echo "--- nouveaux enregistrements DNS attendus ---"
          curl -s -H "Authorization: Bearer $CSK" https://api.clerk.com/v1/domains > /tmp/d2.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/d2.json'))
          liste = d if isinstance(d, list) else (d.get('data') or [])
          for x in liste:
              print('  domaine :', x.get('name'))
              for c in (x.get('cname_targets') or []):
                  print('    CNAME  %-28s -> %s' % (c.get('host'), c.get('value')))
          PY
          echo "--- nouvelle cle publique ---"
          curl -s -H "Authorization: Bearer $CSK" https://api.clerk.com/v1/instance/keys 2>/dev/null \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print("  ", d.get("publishable_key","<non expose par cette route>"))' \
            2>/dev/null || echo "  (a relever au tableau de bord)"
