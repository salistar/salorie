# Build APK Android Salorie sur push main + tag v*
# Pipeline identique a SallyCards — adapte pour Salorie (Expo SDK 52, RN 0.76)
name: Salorie Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# ⚠ TROIS BUILDS EN PARALLELE ECRASAIENT LA MEME RELEASE « latest ».
# Ce workflow republie a chaque poussee sur main le meme `app-debug.apk`, sous
# le meme tag. Quand plusieurs commits partent coup sur coup — ce qui arrive
# des qu'on pousse une correction puis sa documentation — les runs se
# chevauchent et se disputent l'asset : l'API repond `HttpError`, et un build
# PARFAITEMENT REUSSI part en rouge a la derniere etape.
# Constate le 13/09/2026 : l'APK etait construit, l'artefact televerse, et seule
# la publication a echoue.
#
# `cancel-in-progress` supprime la course ET le gaspillage : sur un tag, seul le
# dernier commit compte, et un build de 14 minutes par commit de documentation
# n'apprend rien a personne.
#
# ⚠ LE GROUPE INCLUT `github.ref`, ET C'EST OBLIGATOIRE ICI. Ce workflow se
# declenche aussi sur les tags `v*`. Sans le ref dans le groupe, pousser un tag
# pendant qu'un build de main tourne annulerait l'un des deux — or un build de
# tag produit un binaire qu'on garde.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # required to create GitHub Releases
    steps:
      - uses: actions/checkout@v4

      # ⚠ NODE 22 DEPUIS LE 13/09/2026 : Node 20 est en FIN DE VIE depuis avril
      # 2026 — plus aucun correctif de securite, y compris pour l'outillage qui
      # fabrique le binaire livre. Expo SDK 54 accepte 20 comme 22.
      # Les deux conteneurs (backend, web) sont passes a 22 le 10/09 pour une
      # autre raison (firebase-admin 14 l'exige) ; ceci aligne le reste.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cleanup React 19 RC sub-deps from jest-expo
        run: |
          rm -rf node_modules/jest-expo/node_modules/react
          rm -rf node_modules/jest-expo/node_modules/react-dom
          rm -rf node_modules/jest-expo/node_modules/react-server-dom-webpack
          rm -rf node_modules/jest-expo/node_modules/react-test-renderer
          rm -rf node_modules/jest-expo/node_modules/@types/react

      - name: Disable New Architecture (Bridgeless)
        run: |
          node -e "const f='app.json';const j=JSON.parse(require('fs').readFileSync(f));j.expo.newArchEnabled=false;require('fs').writeFileSync(f,JSON.stringify(j,null,2));"

      # Les niveaux d'API Android sont-ils fixes, et assez hauts pour Play ?
      # Place AVANT le prebuild : le controle ne lit que `app.json` et echoue en
      # secondes, la ou decouvrir le probleme au depot sur Play coute une
      # version prete a sortir.
      - name: Verifier les niveaux d'API Android
        run: node scripts/verifier-android-sdk.js

      - name: Expo prebuild
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS (embedded, no Metro)
        run: |
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache

      # ⚠ UNE SECONDE TENTATIVE, PARCE QUE L'ECHEC VIENT DU RESEAU, PAS DU CODE.
      # Le 10/09/2026, ce build a echoue en 23 s sur :
      #   « Could not resolve org.gradle.toolchains:foojay-resolver:0.5.0 »
      #   plugins.gradle.org injoignable.
      # Rien dans le depot n'avait change ; la relance manuelle est passee. Un
      # echec de resolution de depot est transitoire par nature, et le faire
      # remonter comme une regression apprend a ignorer les alertes rouges.
      #
      # On ne reessaie QUE ce cas : `set -o pipefail` garde le vrai code de
      # sortie, et une erreur de compilation echoue deux fois de suite — donc
      # elle remonte bien, simplement deux minutes plus tard.
      - name: Gradle assembleDebug
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            || { echo "::warning::premiere tentative echouee — nouvel essai dans 30 s"; \
                 sleep 30; ./gradlew assembleDebug --no-daemon; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Seules les releases de VERSION consomment encore ce nom : depuis que la
      # release « latest » ne prend plus que `app-debug.apk`, faire cette copie
      # de 174 Mo sur chaque poussée dans `main` ne servait plus à rien.
      - name: Rename APK with short sha
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/salorie-${SHORT_SHA}.apk
          ls -la android/app/build/outputs/apk/debug/

      - name: Publish "latest" GH Release on every main push (overwrite)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Salorie debug APK"
          body: |
            Auto-generated debug APK Salorie for the latest commit on `main`.

            **Direct download** :
            https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk

            Built from sha: `${{ github.sha }}` at ${{ github.event.head_commit.timestamp }}
          # UNIQUEMENT app-debug.apk : ce nom est FIXE, donc chaque poussée
          # l'écrase et le lien de téléchargement ci-dessus reste valable.
          #
          # `salorie-<sha>.apk` a été retiré d'ICI (il reste sur les releases de
          # version, plus bas). Son nom change à chaque commit : sur une release
          # nommée « latest », rien ne l'écrasait jamais et les APK s'empilaient
          # — 154 fichiers pour 24 Go avant ce correctif. Une release « latest »
          # doit porter la dernière version, pas tout l'historique.
          #
          # L'APK d'un commit précis reste accessible : le job le téléverse déjà
          # comme artefact de workflow (14 jours de rétention, plus haut).
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false

      - name: Create versioned GH Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/salorie-*.apk
          make_latest: true
