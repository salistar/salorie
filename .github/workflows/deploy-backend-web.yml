name: Deploy backend + admin web to VPS

# GitHub (not a local agent) deploys to the VPS. Trigger: push to main touching
# backend/web, OR manual "Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'food4k/**', 'docker-compose.yml', 'docker-compose.override.yml', '.github/workflows/deploy-backend-web.yml']
  workflow_dispatch:
    inputs:
      rotation_turn:
        description: "Faire tourner TURN_SECRET (coupe les appels en cours)"
        type: boolean
        default: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build backend
        working-directory: backend
        run: npm install && npm run build
      - name: Build web
        working-directory: web
        run: npm install && npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Copy the stack to the VPS (source only — node_modules/.next are .dockerignored).
      # scp OVERWRITE mais ne SUPPRIME jamais (`rm: false`, voulu : le dossier
      # cible porte .env et l'override compose, qu'un rm global emporterait).
      # Consequence decouverte le 20/08/2026 : l'ancien web/app/page.tsx a
      # survecu a son deplacement vers /admin, deux pages se sont disputees
      # la racine, et le conteneur a servi un 500. On purge donc AVANT l'envoi
      # les repertoires que le depot possede EN ENTIER — et eux seuls.
      - name: Purge des repertoires possedes par le depot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_DIR }}
            rm -rf web/app web/lib web/public lib assets/data backend/src

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # docker-compose.override.yml et food4k/ ajoutes le 13 aout 2026. Ils n'existaient
          # QUE sur le serveur : l'override porte la topologie reelle de prod (container_name,
          # reseau `edge`, sidecar food4k) et food4k/ est le classifieur tier-0 du scan.
          # Sans eux, une reconstruction du serveur depuis ce depot repartait sans le tier
          # gratuit et avec un backend injoignable par Caddy.
          # Le modele .onnx (212 Mo) reste hors git — trop gros pour GitHub. Il est publie
          # en asset de Release et telecharge au build (cf. food4k/Dockerfile).
          # `lib/` et `assets/data/` ajoutes le 19 aout 2026. Les pages de /me
          # IMPORTENT des modules de calcul du depot mobile (nutriScore, readiness,
          # panierSouk, ramadanAssiettes, sadaqaCalcul) et deux tables de donnees,
          # au lieu d'en garder des copies qui divergeraient. Ces regles annoncent
          # des chiffres a quelqu'un : un Nutri-Score, un score de forme.
          #
          # Sans ces deux repertoires, le build du conteneur `web` echoue sur le
          # serveur avec « /lib: not found » — alors qu'il passe en local, ou tout
          # le depot est present. C'est ce qui a bloque six deploiements d'affilee.
          source: "backend/,web/,food4k/,lib/,assets/data/,docker-compose.yml,docker-compose.override.yml,.dockerignore"
          target: ${{ secrets.VPS_APP_DIR }}
          rm: false
          overwrite: true

      # 2) Build + start the containers on the VPS. Secrets are written to a
      #    .env file (docker compose auto-loads it) — avoids shell-quoting issues.
      - name: docker compose up on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            umask 077
            # .env ADDITIF depuis le 13 aout 2026. Avant, la premiere ligne utilisait `>`
            # et REECRIVAIT le fichier de zero : toute variable posee a la main sur le
            # serveur (un FOOD4K_MIN_CONF ajuste, un reglage de debogage) disparaissait au
            # deploiement suivant, sans trace et sans message. On ne remplace desormais que
            # les cles gerees par ce workflow et on preserve tout le reste.
            touch .env
            grep -vE '^(FIREBASE_SERVICE_ACCOUNT|GEMINI_API_KEY|USDA_API_KEY|AUTH_SECRET|CF_ACCOUNT_ID|CF_API_TOKEN|NEXT_PUBLIC_GMAP_KEY|MAIL_INGEST_KEY|ADMIN_SETUP_KEY)=' .env > .env.next || true
            printf '%s\n' 'FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' >> .env.next
            printf '%s\n' 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> .env.next
            printf '%s\n' 'USDA_API_KEY=${{ secrets.USDA_API_KEY }}' >> .env.next
            printf '%s\n' 'AUTH_SECRET=${{ secrets.AUTH_SECRET }}' >> .env.next
            # Cloudflare Workers AI — tier 2 de la cascade de vision, juste apres food4k.
            # Ajoute le 13 aout 2026 : les deux variables etaient VIDES en production, donc
            # `tryCloudflare` sortait immediatement et Ollama (CPU, lent) restait le seul
            # repli reel. Mesure du jour : @cf/meta/llama-3.2-11b-vision-instruct repond en
            # HTTP 200 pour ~1 neurone par appel, sur 10 000 neurones/jour gratuits.
            # ADMIN_API_KEY protege les routes admin ET le webhook du pipeline. Absente du
            # serveur jusqu'au 13 aout 2026 — reclamee depuis le 29 juillet — elle laissait
            # POST /pipeline/webhook-sink ouvert a tout Internet.
            printf '%s\n' 'ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}' >> .env.next
            # Cle d'installation admin : absente = inscription fermee (bon defaut).
            # Posee, elle rouvre /register a UN compte de plus — l'unique issue quand
            # le mot de passe du back-office est perdu, les mots de passe etant en
            # bcrypt et donc illisibles. Elle n'etait cablee NULLE PART avant le
            # 21/08/2026, d'ou « aucune cle d'installation n'est configuree ».
            printf '%s\n' 'ADMIN_SETUP_KEY=${{ secrets.ADMIN_SETUP_KEY }}' >> .env.next
            # MAIL_INGEST_KEY : cle partagee avec l'Email Worker Cloudflare qui poste les
            # mails de support@salorie.com sur POST /support-mail/ingest. Sans elle,
            # l'endpoint est ferme et les mails n'arrivent que sur le Gmail (forward).
            printf '%s\n' 'MAIL_INGEST_KEY=${{ secrets.MAIL_INGEST_KEY }}' >> .env.next
            printf '%s\n' 'CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}' >> .env.next
            printf '%s\n' 'CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}' >> .env.next
            # Lue comme ARG de build par le service web (cf. docker-compose.yml) : sans
            # elle la carte de l'ecran Courses reste inerte, sans message d'erreur.
            printf '%s\n' 'NEXT_PUBLIC_GMAP_KEY=${{ secrets.NEXT_PUBLIC_GMAP_KEY }}' >> .env.next
            # Espace personnel /me (14 aout 2026). AUCUN nouveau secret : on reutilise
            # les EXPO_PUBLIC_* deja en place pour l'app mobile, simplement renommes au
            # prefixe que Next.js exige. C'est volontaire et c'est le coeur du chantier :
            # une seule instance Clerk et un seul projet Firebase pour les deux clients,
            # donc le meme compte, le meme uid, le meme document Firestore.
            printf '%s\n' 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_TOKEN_URL=${{ secrets.EXPO_PUBLIC_FIREBASE_TOKEN_URL }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}' >> .env.next
            mv .env.next .env

            # TURN_SECRET (15 aout 2026) — secret PARTAGE entre coturn et le backend.
            # Il est genere ICI, sur le serveur, et jamais ailleurs : ni dans le depot
            # (public), ni dans les secrets GitHub, ni dans un presse-papier. Personne
            # n'a besoin de le connaitre, pas meme pour l'installer. Il est ADDITIF —
            # une fois pose, les deploiements suivants le conservent, sinon toutes les
            # sessions vocales en cours seraient invalidees a chaque livraison.
            # ROTATION DELIBEREE. Le secret est conserve par defaut (voir ci-dessus) :
            # le regenerer a chaque livraison invaliderait toutes les sessions vocales
            # en cours. Mais il faut pouvoir le faire tourner — le 21/08/2026 il a ete
            # expose en clair dans un journal d Actions d un depot PUBLIC, par un
            # `docker inspect` de coturn. Un secret vu une fois est un secret mort.
            #
            # On le RETIRE ici ; le bloc suivant en genere un neuf, sur le serveur,
            # avec `openssl rand`. Il ne transite donc par aucun journal, aucun secret
            # GitHub, aucun presse-papier — exactement comme a la premiere installation.
            # Consequence assumee : les appels en cours tombent le temps du redemarrage.
            if [ "${{ inputs.rotation_turn }}" = "true" ]; then
              grep -v '^TURN_SECRET=' .env > .env.rot && mv .env.rot .env
              echo "TURN_SECRET retire — un nouveau va etre genere"
            fi
            if ! grep -q '^TURN_SECRET=' .env; then
              printf 'TURN_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
              echo "TURN_SECRET genere (premiere installation)"
            else
              echo "TURN_SECRET deja present — conserve"
            fi
            grep -q '^TURN_HOST=' .env || printf 'TURN_HOST=%s\n' 'turn.salorie.com' >> .env
            # coturn est passe derriere la traduction d'adresse de Docker (ports
            # publies au lieu du mode host, 15 aout 2026). Il doit donc annoncer
            # l'adresse PUBLIQUE dans ses candidats ICE : sans elle il proposerait
            # son IP de conteneur, que personne ne peut joindre. Reecrite a chaque
            # deploiement — c'est l'IP du serveur, elle ne se devine pas mais elle
            # est connue d'ici.
            grep -vE '^TURN_PUBLIC_IP=' .env > .env.ip || true
            printf 'TURN_PUBLIC_IP=%s\n' '${{ secrets.VPS_HOST }}' >> .env.ip
            mv .env.ip .env

            # Un secret vide s'ecrit sans bruit et ne se voit qu'a l'usage : le 13 aout 2026,
            # CF_ACCOUNT_ID et CF_API_TOKEN sont arrives VIDES (collage avale par le prompt
            # masque de `gh secret set`) et le deploiement s'est affiche en vert. On refuse
            # desormais de continuer sans le dire. Aucune VALEUR n'est journalisee.
            for v in FIREBASE_SERVICE_ACCOUNT AUTH_SECRET CF_ACCOUNT_ID CF_API_TOKEN NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_TOKEN_URL; do
              n=$(grep -m1 "^$v=" .env | cut -d= -f2- | wc -c)
              if [ "$n" -le 1 ]; then echo "::warning::$v est VIDE dans .env — la fonctionnalite associee restera inactive"; else echo "$v: ok ($((n-1)) caracteres)"; fi
            done

            docker compose up -d --build --remove-orphans
            docker compose ps

            # `docker compose up -d` rend 0 des que les conteneurs sont LANCES, meme si
            # l'un d'eux meurt aussitot. Le 4 aout 2026, le backend sortait en code 1 a
            # chaque demarrage — point d'entree introuvable — et Docker le relancait en
            # boucle : l'API a renvoye 502 pendant que cette etape s'affichait en vert.
            # On laisse 40 s aux conteneurs pour se stabiliser, puis on refuse tout
            # service qui n'est pas reste debout.
            sleep 40
            etats=$(docker compose ps --format '{{.Service}} {{.Status}}')
            echo "$etats"
            if echo "$etats" | grep -qiE 'restarting|exited|dead'; then
              echo "::error::Un service n'est pas reste debout apres le deploiement."
              # Le 14 aout 2026, coturn est reste en « Restarting (255) » et ce bloc
              # n'a dumpe que backend et web : le diagnostic a demande un aller-retour
              # de plus. On journalise desormais TOUT service qui n'est pas debout,
              # quel qu'il soit — c'est justement celui-la qu'on a besoin de lire.
              for svc in $(echo "$etats" | grep -iE 'restarting|exited|dead' | awk '{print $1}'); do
                echo "----- journaux de $svc -----"
                docker compose logs --tail=60 "$svc" || true
              done
              docker compose logs --tail=40 backend
              exit 1
            fi

            docker image prune -f
            echo "Conteneurs stables. API -> :4000  Admin web -> :3000"

      # 3) Le seul controle qui compte vraiment : ce que voit un utilisateur. Depuis le
      #    runner, donc a travers le DNS, Cloudflare et Caddy — pas depuis l'interieur du
      #    serveur, ou tout peut sembler sain pendant que l'API renvoie 502 au monde.
      - name: Verifier que l'API repond publiquement
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.salorie.com/health || echo 000)
            echo "essai $i : HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::api.salorie.com/health ne renvoie pas 200 apres le deploiement."
          exit 1
