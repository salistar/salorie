name: Deploy backend + admin web to VPS

# Sync flow: local → push to GitHub (main) → CI builds → SSH deploy to VPS (docker compose).
on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'docker-compose.yml', '.github/workflows/deploy-backend-web.yml']
  workflow_dispatch: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build backend
        working-directory: backend
        run: npm install && npm run build
      - name: Build web
        working-directory: web
        run: npm install && npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (pull + docker compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR || '/opt/salorie' }}
            git pull origin main
            export FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
            docker compose up -d --build
            docker image prune -f
