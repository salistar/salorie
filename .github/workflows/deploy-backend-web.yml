name: Deploy backend + admin web to VPS

# GitHub (not a local agent) deploys to the VPS. Trigger: push to main touching
# backend/web, OR manual "Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'docker-compose.yml', '.github/workflows/deploy-backend-web.yml']
  workflow_dispatch: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build backend
        working-directory: backend
        run: npm install && npm run build
      - name: Build web
        working-directory: web
        run: npm install && npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Copy the stack to the VPS (source only — node_modules/.next are .dockerignored).
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/,web/,docker-compose.yml"
          target: ${{ secrets.VPS_APP_DIR }}
          rm: false
          overwrite: true

      # 2) Build + start the containers on the VPS. Secrets are written to a
      #    .env file (docker compose auto-loads it) — avoids shell-quoting issues.
      - name: docker compose up on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            umask 077
            printf '%s\n' 'FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > .env
            printf '%s\n' 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> .env
            printf '%s\n' 'USDA_API_KEY=${{ secrets.USDA_API_KEY }}' >> .env
            docker compose up -d --build --remove-orphans
            docker compose ps
            docker image prune -f
            echo "Deployed. API -> :4000  Admin web -> :3000"
