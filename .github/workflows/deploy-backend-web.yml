name: Deploy backend + admin web to VPS

# GitHub (not a local agent) deploys to the VPS. Trigger: push to main touching
# backend/web, OR manual "Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'food4k/**', 'docker-compose.yml', 'docker-compose.override.yml', '.github/workflows/deploy-backend-web.yml']
  workflow_dispatch:
    inputs:
      rotation_turn:
        description: "Faire tourner TURN_SECRET (coupe les appels en cours)"
        type: boolean
        default: false

# → deploy-backend-web.md §1
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Le seuil du tier-0 vit dans le code ET dans docker-compose.override.yml,
      # et c'est le compose qui gagne. Deux changements du code, les 30 et 31/08,
      # n'ont rien produit pour cette raison. Ce controle refuse qu'ils divergent.
      - name: Verifier que code et deploiement disent le meme seuil
        run: node scripts/verifier-seuils.js

      - name: Verifier que le .env de production ne peut pas s empiler
        run: node scripts/verifier-env-deploiement.js

      - name: Build backend
        working-directory: backend
        run: npm install && npm run build
      - name: Build web
        working-directory: web
        run: npm install && npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # → deploy-backend-web.md §2
      - name: Purge des repertoires possedes par le depot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_DIR }}
            rm -rf web/app web/lib web/public lib assets/data backend/src
            # → deploy-backend-web.md §3
            rm -f web/middleware.ts

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # → deploy-backend-web.md §4
          source: "backend/,web/,food4k/,lib/,assets/data/,docker-compose.yml,docker-compose.override.yml,.dockerignore"
          target: ${{ secrets.VPS_APP_DIR }}
          rm: false
          overwrite: true

      # 2) Build + start the containers on the VPS. Secrets are written to a
      #    .env file (docker compose auto-loads it) — avoids shell-quoting issues.
      - name: docker compose up on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SALORIE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          # → deploy-backend-web.md §5
          envs: SALORIE_SHA
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            umask 077
            # → deploy-backend-web.md §6
            touch .env
            # → deploy-backend-web.md §7
            grep -vE '^ *(export +)?(FIREBASE_SERVICE_ACCOUNT|GEMINI_API_KEY|USDA_API_KEY|AUTH_SECRET|CF_ACCOUNT_ID|CF_API_TOKEN|NEXT_PUBLIC_[A-Z_]+|MAIL_INGEST_KEY|ADMIN_SETUP_KEY|ADMIN_API_KEY|FOOD4K_MIN_CONF|FOOD4K_MIN_CONF_LOCALE|GIT_COMMIT)( *=| *:)' .env > .env.next || true
            printf 'GIT_COMMIT=%s\n' "${SALORIE_SHA:-inconnu}" >> .env.next
            printf '%s\n' 'FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' >> .env.next
            printf '%s\n' 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> .env.next
            printf '%s\n' 'USDA_API_KEY=${{ secrets.USDA_API_KEY }}' >> .env.next
            printf '%s\n' 'AUTH_SECRET=${{ secrets.AUTH_SECRET }}' >> .env.next
            # → deploy-backend-web.md §8
            printf '%s\n' 'ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}' >> .env.next
            # → deploy-backend-web.md §9
            printf '%s\n' 'FOOD4K_MIN_CONF=${{ vars.FOOD4K_MIN_CONF || '0.80' }}' >> .env.next
            printf '%s\n' 'FOOD4K_MIN_CONF_LOCALE=${{ vars.FOOD4K_MIN_CONF_LOCALE || '0.95' }}' >> .env.next
            # → deploy-backend-web.md §10
            printf '%s\n' 'MAIL_INGEST_KEY=${{ secrets.MAIL_INGEST_KEY }}' >> .env.next
            printf '%s\n' 'CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}' >> .env.next
            printf '%s\n' 'CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}' >> .env.next
            # Lue comme ARG de build par le service web (cf. docker-compose.yml) : sans
            # elle la carte de l'ecran Courses reste inerte, sans message d'erreur.
            printf '%s\n' 'NEXT_PUBLIC_GMAP_KEY=${{ secrets.NEXT_PUBLIC_GMAP_KEY }}' >> .env.next
            # → deploy-backend-web.md §11
            printf '%s\n' 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_FIREBASE_TOKEN_URL=${{ secrets.EXPO_PUBLIC_FIREBASE_TOKEN_URL }}' >> .env.next
            printf '%s\n' 'NEXT_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}' >> .env.next
            mv .env.next .env

            # → deploy-backend-web.md §12
            if [ "${{ inputs.rotation_turn }}" = "true" ]; then
              grep -v '^TURN_SECRET=' .env > .env.rot && mv .env.rot .env
              echo "TURN_SECRET retire — un nouveau va etre genere"
            fi
            if ! grep -q '^TURN_SECRET=' .env; then
              printf 'TURN_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
              echo "TURN_SECRET genere (premiere installation)"
            else
              echo "TURN_SECRET deja present — conserve"
            fi
            grep -q '^TURN_HOST=' .env || printf 'TURN_HOST=%s\n' 'turn.salorie.com' >> .env
            # → deploy-backend-web.md §13
            sed -i '/^TURN_TLS_PORT=/d' .env 2>/dev/null || true
            printf 'TURN_TLS_PORT=%s\n' '443,5349' >> .env

            # → deploy-backend-web.md §14
            CD=/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.salorie.com
            mkdir -p certs-turn
            # L'empreinte est gardee HORS du repertoire protege : celui-ci appartient
            # a `nobody` et l'utilisateur de deploiement n'y a pas acces — il ne peut
            # donc ni lire ni ecrire dedans. (Mon premier essai le faisait, et c'est
            # ce qui a casse la copie au deploiement suivant.)
            EMPREINTE_AVANT="$(cat certs-turn.empreinte 2>/dev/null || echo absent)"
            # → deploy-backend-web.md §15
            if docker run --rm --volumes-from caddy -v "$PWD/certs-turn:/c" alpine:3 sh -c "
                 cp $CD/turn.salorie.com.crt /c/turn.crt &&
                 cp $CD/turn.salorie.com.key /c/turn.key &&
                 chown 65534:65533 /c /c/turn.crt /c/turn.key &&
                 chmod 750 /c && chmod 644 /c/turn.crt && chmod 600 /c/turn.key &&
                 sha256sum /c/turn.crt | cut -c1-16" > certs-turn.empreinte 2>/dev/null; then
              echo "certificat TURN copie pour coturn"
              # → deploy-backend-web.md §16
              EMPREINTE_APRES="$(cat certs-turn.empreinte 2>/dev/null || echo absent)"
              # → deploy-backend-web.md §17
              if docker exec salorie-coturn sh -lc 'netstat -lnt 2>/dev/null | grep -q ":5349"' 2>/dev/null; then
                ECOUTE_TLS=oui
              else
                ECOUTE_TLS=non
              fi
              if [ "$EMPREINTE_AVANT" != "$EMPREINTE_APRES" ] || [ "$ECOUTE_TLS" = "non" ]; then
                docker restart salorie-coturn >/dev/null 2>&1 || true
                sleep 4
                docker exec salorie-coturn sh -lc 'netstat -lnt 2>/dev/null | grep ":5349"' 2>/dev/null \
                  && echo "coturn redemarre — TLS en ecoute" \
                  || echo "coturn redemarre mais TOUJOURS PAS de listener TLS"
              else
                echo "TLS deja en ecoute et certificat inchange — coturn laisse tranquille"
              fi
            else
              echo "certificat turn.salorie.com introuvable chez Caddy — le TLS restera inactif"
            fi
            # → deploy-backend-web.md §18
            grep -vE '^TURN_PUBLIC_IP=' .env > .env.ip || true
            printf 'TURN_PUBLIC_IP=%s\n' '${{ secrets.VPS_HOST }}' >> .env.ip
            mv .env.ip .env

            # Un secret vide s'ecrit sans bruit et ne se voit qu'a l'usage : le 13 aout 2026,
            # CF_ACCOUNT_ID et CF_API_TOKEN sont arrives VIDES (collage avale par le prompt
            # masque de `gh secret set`) et le deploiement s'est affiche en vert. On refuse
            # desormais de continuer sans le dire. Aucune VALEUR n'est journalisee.
            for v in FIREBASE_SERVICE_ACCOUNT AUTH_SECRET CF_ACCOUNT_ID CF_API_TOKEN NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_TOKEN_URL; do
              n=$(grep -m1 "^$v=" .env | cut -d= -f2- | wc -c)
              if [ "$n" -le 1 ]; then echo "::warning::$v est VIDE dans .env — la fonctionnalite associee restera inactive"; else echo "$v: ok ($((n-1)) caracteres)"; fi
            done

            # → deploy-backend-web.md §19
            if ! docker compose ps --status running --format '{{.Service}}' 2>/dev/null | grep -qx mongo; then
              # Installation neuve : mongo n'existe pas encore. On ne pose rien —
              # le deploiement suivant le fera, une fois la base debout.
              echo "::warning::mongo pas encore lance — authentification remise au prochain deploiement."
            else
              if ! grep -q '^MONGO_PASS=' .env; then
                printf 'MONGO_PASS=%s\n' "$(openssl rand -hex 24)" >> .env
                echo "MONGO_PASS genere (premiere pose)"
              fi
              MP=$(grep -m1 '^MONGO_PASS=' .env | cut -d= -f2-)

              # → deploy-backend-web.md §20
              POSER='
                const a = db.getSiblingDB("admin");
                const p = process.env.MP;
                try { a.auth("salorie", p); print("compte Mongo deja en place"); quit(0); } catch (e) {}
                if (a.getUser("salorie")) { a.updateUser("salorie", { pwd: p }); print("compte Mongo mis a jour"); }
                else { a.createUser({ user: "salorie", pwd: p, roles: [{ role: "readWrite", db: "salorie" }] }); print("compte Mongo cree"); }
              '
              if ! docker compose exec -T -e MP="$MP" mongo mongosh --quiet --eval "$POSER"; then
                # On n'active PAS la serrure : personne n'en aurait la clef.
                echo "::error::compte MongoDB impossible a poser — authentification NON activee."
                exit 1
              fi

              # L'URI et le --auth ne sont ecrits qu'APRES la reussite ci-dessus.
              # Reecrits a chaque fois plutot que « poses si absents » : le mot de
              # passe peut avoir change, et une URI perimee vaut une panne totale.
              sed -i '/^MONGO_URI=/d;/^MONGO_CMD=/d' .env
              printf 'MONGO_URI=mongodb://salorie:%s@mongo:27017/salorie?authSource=admin\n' "$MP" >> .env
              printf 'MONGO_CMD=%s\n' 'mongod --auth' >> .env
              echo "authentification MongoDB armee — verifiee apres le demarrage"
            fi

            # → deploy-backend-web.md §21
            fantomes=$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_' || true)
            if [ -n "$fantomes" ]; then
              echo "conteneurs fantomes a retirer :"
              echo "$fantomes" | sed 's/^/  /'
              echo "$fantomes" | xargs -r docker rm -f
            fi

            docker compose up -d --build --remove-orphans

            OLLAMA_MODELE="${OLLAMA_VISION_MODEL:-moondream}"
            if docker compose ps --services 2>/dev/null | grep -qx ollama; then
              echo "  ollama : tirage du modele $OLLAMA_MODELE"
              timeout 900 docker compose exec -T ollama ollama pull "$OLLAMA_MODELE" || echo "  tirage echoue"
            fi
            docker compose ps

            # → deploy-backend-web.md §22
            sleep 40
            etats=$(docker compose ps --format '{{.Service}} {{.Status}}')
            echo "$etats"
            if echo "$etats" | grep -qiE 'restarting|exited|dead'; then
              echo "::error::Un service n'est pas reste debout apres le deploiement."
              # Le 14 aout 2026, coturn est reste en « Restarting (255) » et ce bloc
              # n'a dumpe que backend et web : le diagnostic a demande un aller-retour
              # de plus. On journalise desormais TOUT service qui n'est pas debout,
              # quel qu'il soit — c'est justement celui-la qu'on a besoin de lire.
              for svc in $(echo "$etats" | grep -iE 'restarting|exited|dead' | awk '{print $1}'); do
                echo "----- journaux de $svc -----"
                docker compose logs --tail=60 "$svc" || true
              done
              docker compose logs --tail=40 backend
              exit 1
            fi

            # La serrure s'est-elle refermee sur nous ? Une VRAIE requete sur la
            # base applicative, avec les identifiants du .env. `ping` ne suffirait
            # pas : MongoDB l'autorise sans aucun privilege, donc il repondrait
            # « up » meme si le compte n'avait pas le droit de lire une collection.
            if [ -n "${MP:-}" ]; then
              if docker compose exec -T -e MP="$MP" mongo mongosh --quiet --eval '
                    db.getSiblingDB("admin").auth("salorie", process.env.MP);
                    print("collections lisibles : " + db.getSiblingDB("salorie").getCollectionNames().length);
                  '; then
                echo "authentification MongoDB verifiee"
              else
                echo "::error::MongoDB refuse les identifiants poses — retour en arriere."
                sed -i '/^MONGO_URI=/d;/^MONGO_CMD=/d' .env
                docker compose up -d
                exit 1
              fi
              # Le compte peut etre valide et l'APPLICATION echouer quand meme :
              # driver, base ou source d'authentification differente. On lit donc
              # ce que le backend dit de sa propre connexion.
              if docker compose logs --tail=200 backend 2>/dev/null \
                   | grep -qiE 'Authentication failed|not authorized|MongoServerSelectionError'; then
                echo "::error::le backend n'arrive pas a s'authentifier aupres de MongoDB — retour en arriere."
                docker compose logs --tail=40 backend || true
                sed -i '/^MONGO_URI=/d;/^MONGO_CMD=/d' .env
                docker compose up -d
                exit 1
              fi
            fi

            docker image prune -f
            echo "Conteneurs stables. API -> :4000  Admin web -> :3000"

      # 3) Le seul controle qui compte vraiment : ce que voit un utilisateur. Depuis le
      #    runner, donc a travers le DNS, Cloudflare et Caddy — pas depuis l'interieur du
      #    serveur, ou tout peut sembler sain pendant que l'API renvoie 502 au monde.
      - name: Verifier que l'API repond publiquement
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.salorie.com/health || echo 000)
            echo "essai $i : HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::api.salorie.com/health ne renvoie pas 200 apres le deploiement."
          exit 1
